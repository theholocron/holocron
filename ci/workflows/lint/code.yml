name: Static Analysis

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      enable-auto-commit:
        description: >
          Auto-commit eslint --fix results as a verified commit via a GitHub App.
          Requires SUPER_LINTER_APP_ID and SUPER_LINTER_PRIVATE_KEY secrets
          (same App used across every formatting-capable task — D12).
        type: boolean
        required: false
        default: false
    secrets:
      SUPER_LINTER_APP_ID:
        required: false
      SUPER_LINTER_PRIVATE_KEY:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  static-analysis:
    name: Run eslint, actionlint and prettier
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
      APP_ID_SET: ${{ secrets.SUPER_LINTER_APP_ID != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SUPER_LINTER_APP_ID }}
          private-key: ${{ secrets.SUPER_LINTER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      # actionlint has no npm distribution — install the prebuilt binary via
      # the maintainer's own documented download script.
      # NOTE: unverified against a live CI run at authoring time (D12) — flag
      # here if this needs adjustment.
      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/actionlint

      - name: Check for merge-conflict markers
        # No package distributes this as a standalone tool — a plain grep for
        # the marker lines (the same check the old bundled linter ran, D12).
        run: |
          if grep -rlnE '^(<{7}|={7}|>{7})( |$)' \
            --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::merge-conflict markers found"
            exit 1
          fi

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run eslint and actionlint
        with:
          task: lint:code

      - uses: theholocron/.github/.github/actions/auto-commit@main
        name: Commit and push eslint --fix
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true' &&
          steps.app-token.conclusion == 'success'
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit-message: "chore: fix static-analysis issues"
          commit-options: "--no-verify"

      # prettier's check (and its opt-in fix commit, the same App token as above) is the `format` action, not a workflow
      # of its own. It is called by path because the action is new and `theholocron/.github` is frozen, so no
      # remote copy of it exists; the path resolves in the repo that hosts the reusables, which is the only caller of
      # this file until `ci-v1` exists (then it becomes `theholocron/holocron/ci/actions/format@ci-v1`).
      - uses: ./ci/actions/format
        name: Run prettier
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
