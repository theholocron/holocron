name: lint:editorconfig

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      HOLOCRON_TURBO_TOKEN:
        description: The Turbo remote cache token. Read first; the TURBO_TOKEN secret is the fallback.
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  lint-editorconfig:
    name: Run editorconfig-checker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      # editorconfig-checker has no npm distribution — install the prebuilt
      # binary from its release tarball (v4.0.1+ ships the binary at the
      # tarball root as `editorconfig-checker`, not `bin/ec-<os>-<arch>` —
      # confirmed against a live CI run; the old asset name/path 404s now).
      - name: Install editorconfig-checker
        run: |
          curl -sSL https://github.com/editorconfig-checker/editorconfig-checker/releases/latest/download/editorconfig-checker-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin editorconfig-checker

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run editorconfig-checker
        with:
          task: lint:editorconfig
