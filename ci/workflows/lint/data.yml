name: Structured Data Validation

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      HOLOCRON_TURBO_TOKEN:
        description: The Turbo remote cache token. Read first; the TURBO_TOKEN secret is the fallback.
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  structured-data-validation:
    name: Run yamllint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      # yamllint has no npm distribution — Python ships preinstalled on
      # ubuntu-latest runners.
      - name: Install yamllint
        run: pip install --user yamllint

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run yamllint
        with:
          task: lint:data
