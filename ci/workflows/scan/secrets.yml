name: Secret Detection

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      HOLOCRON_TURBO_TOKEN:
        description: The Turbo remote cache token. Read first; the TURBO_TOKEN secret is the fallback.
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  secret-detection:
    name: Run gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      # gitleaks has no npm distribution — install the prebuilt binary via
      # the maintainer's own documented install script.
      # NOTE: unverified against a live CI run at authoring time (D12) — flag
      # here if this needs adjustment.
      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run gitleaks
        with:
          task: scan:secrets

  # Advisory (#1573): betterleaks v2 is still a release candidate, so this job
  # never fails the run (each step has `continue-on-error`, so the job ends
  # green) and gitleaks above stays the required check. A finding or a failed
  # install shows as a warning. It runs only in a repo that has a
  # `betterleaks.toml`. When v2 is stable, bump the pin, drop `continue-on-error`
  # and retire the gitleaks job.
  betterleaks:
    name: Run betterleaks (advisory)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      # Betterleaks has no GitHub Action. Install one pinned release and check
      # the tarball against the SHA-256 written here, not one fetched beside it.
      - name: Install betterleaks
        id: install
        if: ${{ hashFiles('betterleaks.toml') != '' }}
        continue-on-error: true
        env:
          BETTERLEAKS_VERSION: 2.0.0-rc.9
          BETTERLEAKS_SHA256: 772a1a2e2d13a5bd80ef4bc900ad90942ac4383ac79fb6cdfcc7df542434f2f8
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" betterleaks
          install -m 0755 "${RUNNER_TEMP}/betterleaks" /usr/local/bin/betterleaks

      # Medium confidence and up: the low-confidence generic rules flag test
      # fixtures. Betterleaks reads `.betterleaksignore` (exact secret values
      # to skip) from the checkout itself.
      - name: Run betterleaks
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          if ! betterleaks git --no-banner --config betterleaks.toml --confidence=medium --redact .; then
            echo "::warning title=betterleaks::Advisory scan found something or failed. Gitleaks is the required check; see the log."
            exit 1
          fi
