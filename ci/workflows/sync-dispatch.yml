name: Sync Dispatch

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      steps:
        description: >
          Sync steps to pass to each repo's sync.yml. Default is "readme"
          (only README marker blocks are updated).
        type: string
        required: false
        default: readme

permissions:
  contents: read

jobs:
  broadcast:
    name: Broadcast sync to all repos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch sync to all repos with sync.yml
        run: |
          gh api "/orgs/$GITHUB_REPOSITORY_OWNER/repos" --paginate --jq '.[].name' \
            | while IFS= read -r repo; do
              gh api "/repos/$GITHUB_REPOSITORY_OWNER/$repo/contents/.github/workflows/sync.yml" --silent 2>/dev/null || continue
              echo "Dispatching sync to $GITHUB_REPOSITORY_OWNER/$repo"
              gh workflow run sync.yml \
                --repo "$GITHUB_REPOSITORY_OWNER/$repo" \
                --field "steps=$STEPS" \
              || echo "Warning: could not dispatch to $GITHUB_REPOSITORY_OWNER/$repo — skipping"
            done
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN }}
          STEPS: ${{ inputs.steps }}
