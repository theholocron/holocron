name: Bookkeeping

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      configuration-path:
        description: Path to the labeler configuration file in the calling repo
        type: string
        required: false
        default: .github/labeler.yml

jobs:
  label:
    name: Apply Labels
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ inputs.configuration-path || '.github/labeler.yml' }}
          sparse-checkout-cone-mode: false

      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        if: ${{ github.event_name == 'pull_request' && hashFiles(inputs.configuration-path || '.github/labeler.yml') != '' }}
        # v3.4 bundles Node 20; allow it to run under Actions' current default.
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          # Fall back to default path when triggered directly (not via workflow_call)
          # because inputs.* defaults only apply on workflow_call events.
          configuration-path: ${{ inputs.configuration-path || '.github/labeler.yml' }}
          include-title: 1
          include-body: 0
          sync-labels: 1
          enable-versioned-regex: 0
          repo-token: ${{ github.token }}
