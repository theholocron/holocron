packages:
  - 'packages/*'

# Shared dep versions used across packages. Add named catalogs as
# plugin packages grow.
catalog:
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/eslint-plugin': ^1.6.24
  eslint: ^10.8.0
  eslint-plugin-n: ^18.2.2
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.7.0
  chalk: ^5.6.2
  ora: ^9.4.1
  tsdown: ^0.22.14
  turbo: ^2.10.7
  tsx: 4.23.1
  vitest: ^4.1.10
  typescript: ^5.9.3
  yargs: ^18.0.0
  '@types/node': ^26
  '@types/yargs': ^17.0.35

catalogs:
  # Shared clients — release in lockstep; bump all entries together.
  clients:
    '@theholocron/clerk-client': ^1.3.3
    '@theholocron/doppler-client': ^1.3.3
    '@theholocron/github-client': ^1.3.3
    '@theholocron/http-client': ^1.3.3
    '@theholocron/infisical-client': ^1.3.3
    '@theholocron/neon-client': ^1.3.3
    '@theholocron/postman-client': ^1.3.3
    '@theholocron/vercel-client': ^1.3.3

  # Shared configs — release in lockstep; bump all entries together.
  configs:
    '@theholocron/commitlint-config': ^7.5.0
    '@theholocron/holocron-config': ^7.5.0
    '@theholocron/eslint-config': ^7.6.0
    '@theholocron/lint-staged-config': ^7.5.0
    '@theholocron/prettier-config': ^7.5.0
    '@theholocron/semantic-release-config': ^7.5.0
    '@theholocron/tsconfig': ^7.5.0
    '@theholocron/tsdown-config': ^7.5.0
    '@theholocron/vitest-config': ^7.5.0

# Force all packages (including external transitive deps) to use the
# same http-client instance — prevents instanceof ProviderApiError
# dual-module hazard when github-client and cli both depend on it.
overrides:
  '@theholocron/http-client': ^1.3.3
  tsx: 4.22.4
