packages:
  - 'packages/*'

# Shared dep versions used across packages. Add named catalogs as
# plugin packages grow (e.g. `vitest:` for testing, `eslint:` for lint).
catalog:
  '@theholocron/eslint-config': ^3.5.1
  '@theholocron/prettier-config': ^3.5.1
  '@theholocron/tsconfig': ^3.4.4
  '@tsconfig/node-lts': ^22.0.2
  tsx: ^4.19.2
  typescript: ^5.6.3
