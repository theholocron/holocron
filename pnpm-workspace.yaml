packages:
  - 'docs'
  - 'packages/*'

# Shared dep versions used across packages. Add named catalogs as
# plugin packages grow.
catalog:
  '@inquirer/prompts': ^8.5.2
  '@sentry/node': ^10.70.0
  '@types/node': ^26
  '@types/yargs': ^17.0.35
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/eslint-plugin': ^1.6.27
  chalk: ^6.0.0
  eslint: ^10.8.1
  eslint-plugin-n: ^18.3.0
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.11.0
  ora: ^9.4.1
  tsdown: ^0.22.14
  tsx: 4.23.12
  turbo: ^2.10.10
  typescript: ^5.9.3
  vitest: ^4.1.10
  yargs: ^18.1.0

catalogs:
  # Shared clients — release in lockstep; bump all entries together.
  clients:
    '@theholocron/clerk-client': ^1.11.2
    '@theholocron/cloudflare-client': ^1.11.2
    '@theholocron/doppler-client': ^1.11.2
    '@theholocron/github-client': ^1.11.2
    '@theholocron/http-client': ^1.11.2
    '@theholocron/infisical-client': ^1.11.2
    '@theholocron/neon-client': ^1.11.2
    '@theholocron/posthog-client': ^1.11.2
    '@theholocron/postman-client': ^1.11.2
    '@theholocron/sentry-client': ^1.11.2
    '@theholocron/vercel-client': ^1.11.2

  # Shared configs — release in lockstep; bump all entries together.
  configs:
    '@theholocron/astro-config': ^7.25.5
    '@theholocron/commitlint-config': ^7.20.0
    '@theholocron/devmoji-config': ^7.20.0
    '@theholocron/docs-theme': ^1.3.5
    '@theholocron/eslint-config': ^7.25.3
    '@theholocron/holocron-config': ^7.20.0
    '@theholocron/lint-staged-config': ^7.20.0
    '@theholocron/prettier-config': ^7.20.0
    '@theholocron/semantic-release-config': ^7.20.0
    '@theholocron/tsconfig': ^7.20.0
    '@theholocron/tsdown-config': ^7.20.0
    '@theholocron/vitest-config': ^7.20.0

# Force all packages (including external transitive deps) to use the
# same http-client instance — prevents instanceof ProviderApiError
# dual-module hazard when github-client and cli both depend on it.
overrides:
  '@theholocron/http-client': ^1.11.2
  tsx: 4.23.12
