packages:
  - "docs"
  - "apps/*"
  - "cli/*"
  - "clients/*"
  - "plugins/*"
  - "observability"
  - "skills"
  - "utils/*"
  - "configs/*"
  - "themes/*"

# Shared dep versions used across packages. Add named catalogs as
# plugin packages grow.
catalog:
  "@axiomhq/pino": ^2.0.0
  "@commitlint/config-conventional": ^21.2.3
  "@commitlint/lint": ^21.2.3
  "@commitlint/load": ^21.2.3
  "@commitlint/types": ^21.2.3
  "@inquirer/prompts": ^8.5.2
  "@inquirer/search": ^4.3.3
  "@semantic-release/commit-analyzer": ^13.0.1
  "@semantic-release/release-notes-generator": ^14.1.1
  "@sentry/node": ^11.9.0
  "@tktco/node-actionlint": ^1.6.0
  "@tsconfig/node-lts": ^24.0.1
  "@types/node": ^26
  "@types/yargs": ^17.0.35
  "@vitest/coverage-v8": ^5.0.5
  "@vitest/eslint-plugin": ^1.6.27
  "@vscode-shellcheck/shellcheck-wasm": ^0.2.0
  alex: ^11.0.1
  chalk: ^6.0.0
  dotenv: ^17.4.2
  editorconfig: ^3.0.2
  eslint: ^10.8.1
  eslint-plugin-n: ^18.3.0
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.11.0
  happy-dom: ^21.0.4
  markdownlint: ^0.41.1
  ora: ^9.4.1
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  posthog-node: ^5.57.2
  prettier: ^3.9.6
  tsdown: ^0.23.3
  tsx: 4.23.15
  turbo: ^2.10.12
  starlight-typedoc: ^0.23.1
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.14.1
  typescript: ^5.9.3
  vitest: ^5.0.5
  yaml: ^2.9.0
  yargs: ^18.1.0

catalogs:
  # Minimum client versions the plugins accept as peers (their peerDependencies range). The
  # clients themselves resolve from the workspace (workspace:^), so these are compatibility
  # floors, not what this repo builds against.
  clients:
    "@theholocron/axiom-client": ^1.43.1
    "@theholocron/checkly-client": ^1.55.0
    "@theholocron/clerk-client": ^1.43.1
    "@theholocron/cloudflare-client": ^1.53.1
    "@theholocron/discord-client": ^1.50.0
    "@theholocron/doppler-client": ^1.43.1
    "@theholocron/github-client": ^1.51.0
    "@theholocron/infisical-client": ^1.43.1
    "@theholocron/neon-client": ^1.43.1
    "@theholocron/netlify-client": ^1.43.0
    "@theholocron/postman-client": ^1.43.1
    "@theholocron/sentry-client": ^1.56.0
    "@theholocron/slack-client": ^1.43.1
    "@theholocron/vercel-client": ^1.43.1

  # Configs the root tooling loads before anything is built (ESLint, Prettier, commitlint,
  # lint-staged, markdownlint, devmoji, semantic-release) stay on the published copy: a tool
  # cannot lint or format with a config it has not built yet. Plus holocron-config, which is
  # not in this repo. Every other config under configs/ resolves from the workspace (workspace:^).
  configs:
    "@theholocron/commitlint-config": ^8.8.0
    "@theholocron/devmoji-config": ^8.8.2
    "@theholocron/eslint-config": ^8.8.2
    "@theholocron/holocron-config": ^8.8.2
    "@theholocron/lint-staged-config": ^8.8.2
    "@theholocron/markdownlint-config": ^8.8.2
    "@theholocron/prettier-config": ^8.8.2
    "@theholocron/semantic-release-config": ^8.8.2

  # Minimum util versions the plugins accept as peers (see clients above).
  utils:
    "@theholocron/fs-utils": ^1.16.0
    "@theholocron/misc-utils": ^1.16.0

# @sentry/node and posthog-node are pinned exactly so every consumer resolves the
# same version. @theholocron/http-client peers on both, and pnpm creates a
# SEPARATE physical http-client instance per distinct peer-resolved version set
# it sees anywhere in the graph -- an external published dependency (e.g.
# holocron-config's npm-resolved @theholocron/cli, which doesn't read this
# workspace's catalog) can resolve a newer sentry/posthog and split
# `instanceof ProviderApiError` across two copies. Found live: holocron#782's
# @theholocron/holocron-config dependency pulled in exactly this.
#
# http-client itself used to be pinned here too, to keep github-client and the
# CLI on one copy. It is no longer: the clients live in this repo (clients/*,
# #1211), the CLI and plugins resolve it from the workspace (workspace:^),
# and with the pin removed the lockfile still holds a single
# http-client and the CLI and plugin suites pass. If a dependency bump ever
# splits it again, pin it here (exactly) rather than with a caret.
#
# Both pins are EXACT (no caret) -- a caret range only constrains what's
# ACCEPTABLE, and pnpm is still free to resolve different exact versions for
# different consumers as long as each satisfies the range, recreating the same
# split one version bump later. Found live twice with http-client: bumping
# github-client alone pulled in http-client@1.26.0 for that one edge while every
# other consumer stayed on 1.25.0, splitting ProviderApiError under a caret
# override that permitted both.
#
# cookie and tsx are pinned too, but for unrelated reasons, and not
# both exactly -- cookie is constrained to the 2.x line (caret range,
# not exact: ^2.0.1) to dodge cookie@0.7.1, which broke the docs
# prerender build (#332); tsx IS an exact pin. 6e27c06d pinned tsx to
# 4.22.4 to dodge an ENOENT crash hit on 4.23.x (then at .12); three
# patches have shipped since (.13/.14/.15) and none reproduce it --
# verified against the exact vulnerable path (datapad's tsx/esm/api
# config loader) plus a full `holocron run ci`, so pinned at current
# latest instead of the stale downgrade. Both cookie and tsx used to
# live in package.json's own `pnpm.overrides`, which pnpm prefers over
# this block when both exist -- meaning this whole `overrides:` block,
# including the single-instance pins above, was silently never
# applied (holocron#908).
overrides:
  "@astrojs/starlight>@astrojs/markdown-satteri": 0.4.5
  "@astrojs/starlight>satteri": 0.10.5
  "@sentry/node": 10.75.2
  conventional-changelog-conventionalcommits: 9.3.1
  cookie: ^2.0.1
  posthog-node: 5.52.5
  tsx: 4.23.15
