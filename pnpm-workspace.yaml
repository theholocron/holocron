packages:
  - 'packages/*'

# Shared dep versions used across packages. Add named catalogs as
# plugin packages grow.
catalog:
  '@theholocron/eslint-config': ^5.1.1
  '@theholocron/prettier-config': ^4.1.0
  '@theholocron/tsconfig': ^4.1.0
  '@tsconfig/node-lts': ^24.0.0
  '@vitest/eslint-plugin': ^1.6.23
  eslint: ^10.7.0
  eslint-plugin-n: ^18.2.2
  globals: ^17.7.0
  tsdown: ^0.22.3
  tsx: ^4.22.4
  vitest: ^3.2.6
  '@vitest/coverage-v8': ^3.2.6
  # TypeScript pinned to latest 5.x. @theholocron/tsconfig@4 declares
  # `typescript@^5` as peer; bumping to 6 produces a peer warning until
  # the org-level tsconfig publishes a 6-compatible release.
  typescript: ^5.9.3
