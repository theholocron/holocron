name: Audit the bundle size

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  bundle-size:
    name: Audit the bundle size
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Read by the bundle-stats uploader inside `holocron run delivery.build`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Build and upload bundle stats
        with:
          task: delivery.build

  conclusion:
    name: Conclusion
    runs-on: ubuntu-latest
    if: always()
    needs: [bundle-size]
    steps:
      - name: Check job statuses
        run: |
          if [[ "$RESULTS" == *"failure"* ]] || [[ "$RESULTS" == *"cancelled"* ]]; then
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
