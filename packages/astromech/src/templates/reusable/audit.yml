name: Audit

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      build-script:
        description: >
          DEPRECATED — the bundle-size job now runs `holocron run build`
          (resolved from the task manifest). Ignored; kept so existing callers
          do not error.
        type: string
        required: false
        default: pnpm build
      run-knip:
        description: Run Knip to detect unused files, exports, and dependencies
        type: boolean
        required: false
        default: false
      run-performance:
        description: Run Lighthouse CI performance audit (requires a lighthouse config file)
        type: boolean
        required: false
        default: false
      lighthouse-config:
        description: >
          Path to the Lighthouse CI config file, forwarded to `holocron run
          audit performance -- --config`. Defaults to lighthouse.config.cjs
          (the org standard).
        type: string
        required: false
        default: lighthouse.config.cjs
      knip-script:
        description: >
          DEPRECATED — the knip job now runs `holocron run audit knip` (resolved
          from the task manifest). Ignored; kept so existing callers do not error.
        type: string
        required: false
        default: pnpm run audit
    secrets:
      CODECOV_TOKEN:
        required: false
      LHCI_GITHUB_APP_TOKEN:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  bundle-size:
    name: Audit the bundle size
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Read by the bundle-stats uploader inside `holocron run build`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Build and upload bundle stats
        with:
          task: build

  knip:
    name: Knip
    if: ${{ inputs.run-knip }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          persist-credentials: false

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run Knip
        with:
          task: audit
          job: knip

  performance:
    name: Audit the performance
    if: ${{ inputs.run-performance }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Read by `lhci autorun` inside `holocron run audit performance`.
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: npm install -g @lhci/cli@0.14.x
        name: Install Lighthouse CLI

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run Lighthouse CI
        with:
          task: audit
          job: performance
          args: --config=${{ inputs.lighthouse-config }}


  conclusion:
    name: Conclusion
    runs-on: ubuntu-latest
    if: always()
    needs: [bundle-size, knip, performance]
    steps:
      - name: Check job statuses
        run: |
          if [[ "$RESULTS" == *"failure"* ]] || [[ "$RESULTS" == *"cancelled"* ]]; then
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
