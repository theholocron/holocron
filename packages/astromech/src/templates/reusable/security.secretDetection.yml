name: Secret Detection

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false

jobs:
  secret-detection:
    name: Secret Detection
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 0

      # gitleaks has no npm distribution — install the prebuilt binary via
      # the maintainer's own documented install script.
      # NOTE: unverified against a live CI run at authoring time (D12) — flag
      # here if this needs adjustment.
      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Run gitleaks
        with:
          task: security.secretDetection
