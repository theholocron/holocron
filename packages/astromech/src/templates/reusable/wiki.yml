name: Wiki

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      fern-version:
        description: >
          Fern CLI version to install. Pin this to avoid breaking changes when
          Fern updates their config schema.
        type: string
        required: false
        default: "5.114.1"
      preview:
        description: >
          When true, publishes a preview instead of production.
          Requires preview-id to be set.
        type: boolean
        required: false
        default: false
      preview-id:
        description: >
          Stable ID for the preview URL. The preview is accessible at
          {fern-org}-preview-{id}.docs.buildwithfern.com. Use the PR number
          (e.g. "pr-123") so the same URL is reused on every push to
          the branch.
        type: string
        required: false
        default: ""
      fern-org:
        description: >
          Fern workspace org slug (e.g. "holocron"). When set, a GitHub
          deployment is created after a successful preview so the URL appears
          in the PR sidebar widget — the same pattern as Cloudflare Pages previews.
        type: string
        required: false
        default: ""
      base-path:
        description: >
          Basepath appended to the preview URL (e.g. "holocron" when using
          multi-source routing with wiki.theholocron.dev/holocron).
          Omit for single-instance Fern sites.
        type: string
        required: false
        default: ""
    secrets:
      HOLOCRON_FERN_TOKEN:
        required: false
      FERN_TOKEN:
        required: false

jobs:
  publish:
    name: ${{ inputs.preview && 'Preview' || 'Publish' }} to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - name: Install Fern CLI
        run: npm install -g "fern-api@$FERN_VERSION"
        env:
          FERN_VERSION: ${{ inputs.fern-version }}

      - name: Publish docs
        if: ${{ !inputs.preview }}
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.HOLOCRON_FERN_TOKEN || secrets.FERN_TOKEN }}

      - name: Preview docs
        if: ${{ inputs.preview && inputs.preview-id != '' }}
        run: fern generate --docs --preview --id "$PREVIEW_ID"
        env:
          FERN_TOKEN: ${{ secrets.HOLOCRON_FERN_TOKEN || secrets.FERN_TOKEN }}
          PREVIEW_ID: ${{ inputs.preview-id }}

      - name: Report preview URL
        if: ${{ inputs.preview && inputs.preview-id != '' && inputs.fern-org != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERN_ORG: ${{ inputs.fern-org }}
          PREVIEW_ID: ${{ inputs.preview-id }}
          BASE_PATH: ${{ inputs.base-path }}
        run: |
          PREVIEW_URL="https://${FERN_ORG}-preview-${PREVIEW_ID}.docs.buildwithfern.com${BASE_PATH:+/${BASE_PATH}}"
          PAYLOAD=$(printf '{"ref":"%s","environment":"wiki (Preview)","description":"Wiki","production_environment":false,"auto_merge":false,"required_contexts":[]}' \
            "$GITHUB_HEAD_REF")
          DEPLOY_ID=$(echo "$PAYLOAD" | gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            --method POST --input - | jq -r '.id')
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOY_ID}/statuses" \
            --method POST --field state=success --field environment_url="$PREVIEW_URL"
