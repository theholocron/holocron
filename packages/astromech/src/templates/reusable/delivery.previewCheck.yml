name: Preview Check

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      preview-url:
        description: The PR's Vercel preview deployment URL, extracted from the triggering `deployment_status` event.
        required: true
        type: string
      sha:
        description: The deployed commit SHA — checked out explicitly, since GitHub evaluates which version of this workflow file to run from the default branch for a deployment_status event (unlike push/pull_request), and actions/checkout defaults to that same ref absent an explicit override.
        required: true
        type: string
      cwd:
        description: Directory to run the check from — the opted-in package's own directory in a monorepo. Defaults to the repo root.
        required: false
        type: string
        default: "."
      vercel-project:
        description: >
          Expected Vercel project id/name the preview URL must resolve
          to (verified live via Vercel's API) before
          VERCEL_PROTECTION_BYPASS_SECRET is ever attached to a request
          (holocron#1032 review) — a bare *.vercel.app hostname proves
          nothing on its own, since anyone can register their own
          Vercel project. Omitted → the bypass secret is never
          attached, regardless of whether it's configured.
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        description: >
          Required alongside vercel-project to verify deployment
          ownership via Vercel's API (read-only use here). Not required
          when vercel-project is omitted.
        required: false
      VERCEL_PROTECTION_BYPASS_SECRET:
        description: >
          Vercel's "Protection Bypass for Automation" secret for the
          target project (holocron#1030) — sent as the
          x-vercel-protection-bypass header so this check's request
          isn't redirected to Vercel's own SSO login by Deployment
          Protection, which is on by default for Preview deployments.
          Optional: a check against a URL with protection disabled (or
          a provider other than Vercel) needs nothing here.
        required: false

jobs:
  preview-check:
    name: Run monitoring checks against the preview deployment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the preview URL
        id: validate
        env:
          CANDIDATE: ${{ inputs.preview-url }}
        run: |
          # `preview-url` comes from the triggering deployment_status
          # event's environment_url -- set by whoever created that
          # deployment status, not necessarily this repo's own
          # delivery.previewDeploy job (anyone with `deployments: write`
          # could create one directly via the API). Validated here,
          # independently of the event's origin, before this runner
          # ever issues an HTTP request to it (the monitoring check
          # below): without this, a crafted environment_url could point
          # the runner at an internal or attacker-controlled host
          # (SSRF) instead of a real Vercel preview. Forwarding the
          # re-serialized `url.href` rather than the raw input also
          # closes off argument injection through embedded whitespace
          # or shell metacharacters -- a string that parses can't carry
          # either.
          host=$(node -e 'try { process.stdout.write(new URL(process.argv[1]).hostname) } catch { process.exit(1) }' "$CANDIDATE") || host=""
          if [[ "$host" != *.vercel.app ]]; then
            echo "::error::preview-url '$CANDIDATE' does not parse to a *.vercel.app host (parsed host: '${host:-<unparseable>}')"
            exit 1
          fi
          url=$(node -e 'const u = new URL(process.argv[1]); if (u.protocol !== "https:") process.exit(1); process.stdout.write(u.href)' "$CANDIDATE") || {
            echo "::error::preview-url '$CANDIDATE' did not parse to an https:// URL"
            exit 1
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          ref: ${{ inputs.sha }}
          # This checks out and runs a PR's own holocron.config.ts —
          # untrusted until reviewed. Never leave a credential sitting
          # in .git/config for that code to read and exfiltrate; no
          # later step in this job needs to push or pull authenticated.
          persist-credentials: false

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Resolve author trust from the deployment payload
        id: trust
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.deployment.payload.author_association }}
        run: |
          # Carried forward from delivery.previewDeploy's own
          # github.event.pull_request.author_association, via the
          # deployment's `payload` field -- deployment_status has no
          # pull_request context of its own to read this from directly
          # (holocron#1057: the bypass header reaches this PR's own
          # deployed code over the wire, so nothing stops that code
          # reading and exfiltrating it; project-ownership verification
          # alone doesn't help, since the deployment legitimately
          # belongs to the protected project). Missing or unrecognized
          # -> untrusted (fail-closed): a deployment created some other
          # way (anyone with `deployments: write` can create one
          # directly via the API) carries no such payload at all, and
          # an absent credential is safer than a wrongly granted one.
          case "$AUTHOR_ASSOCIATION" in
            OWNER | MEMBER | COLLABORATOR) trusted=true ;;
            *) trusted=false ;;
          esac
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

      - name: Resolve monitoring checks
        id: resolve
        # Untrusted: loads and runs a PR's own holocron.config.ts, same
        # as the checkout above. No secrets in this step's env at all
        # (holocron#1032 review) -- VERCEL_TOKEN and
        # VERCEL_PROTECTION_BYPASS_SECRET live only on the step below,
        # which never loads this repo's config and so never runs a
        # single line of PR-authored code.
        uses: theholocron/.github/.github/actions/holocron@main
        with:
          command: monitoring resolve-checks
          args: --cwd=${{ inputs.cwd }} --out=${{ runner.temp }}/monitoring-checks.json

      - name: Verify project and run monitoring checks
        env:
          # Read directly by `monitoring run-resolved`
          # (packages/cli/src/cli.ts) -- not part of the CLI's own
          # `--token`-resolution chain, since neither is a vendor API
          # credential this command calls anything with: VERCEL_TOKEN
          # only verifies, read-only, that the preview URL resolves to
          # vercel-project before VERCEL_PROTECTION_BYPASS_SECRET (a
          # plain header forwarded as-is) is ever attached. The command
          # itself never attaches the bypass header when vercel-project
          # is empty, regardless of whether these secrets are
          # configured -- never attached to an unverified URL.
          #
          # Both gated on `steps.trust.outputs.trusted` (holocron#1057):
          # confirmed live that Vercel forwards this header straight
          # through to the deployed function, so an untrusted PR's own
          # code could read and exfiltrate it off its own incoming
          # request. An untrusted deployment gets neither secret at
          # all -- the request below still runs, just without the
          # bypass header, so it fails loudly against Deployment
          # Protection (the pre-#1032 symptom, for that population
          # only) rather than silently skipping the check.
          VERCEL_TOKEN: ${{ steps.trust.outputs.trusted == 'true' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ steps.trust.outputs.trusted == 'true' && secrets.VERCEL_PROTECTION_BYPASS_SECRET || '' }}
        uses: theholocron/.github/.github/actions/holocron@main
        with:
          command: monitoring run-resolved
          args: --checks-file=${{ runner.temp }}/monitoring-checks.json --vercel-project=${{ steps.trust.outputs.trusted == 'true' && inputs.vercel-project || '' }} ${{ steps.validate.outputs.url }}
