name: Delivery

on: # yamllint disable-line rule:truthy
  deployment_status:

permissions:
  contents: read

jobs:
  preview-check:
    name: Preview Check
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    uses: theholocron/.github/.github/workflows/delivery.previewCheck.yml@main
    with:
      preview-url: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    secrets: inherit
