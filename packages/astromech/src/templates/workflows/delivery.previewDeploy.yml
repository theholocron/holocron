name: Delivery

on: # yamllint disable-line rule:truthy
  pull_request: {}

concurrency:
  group: preview-deploy-${{ github.event.pull_request.number }}
  # Not true: a cancelled run could land between Vercel accepting the
  # upload and the report job posting a status, leaving a real preview
  # deployment with no corresponding GitHub check — worse than letting an
  # overlapping run for the same PR simply queue.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  preview-deploy:
    name: Preview Deploy
    uses: theholocron/.github/.github/workflows/delivery.previewDeploy.yml@main
    with:
      cwd: "."
    secrets: inherit
