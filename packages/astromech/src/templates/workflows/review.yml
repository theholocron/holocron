name: Source Quality

on: # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  review:
    name: Annotations
    uses: theholocron/.github/.github/workflows/review.yml@main
    secrets: inherit
