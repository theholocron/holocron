name: Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    uses: theholocron/.github/.github/workflows/deploy.yml@main
    secrets: inherit
