name: Sync

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - holocron.config.ts
      - package.json
      - pnpm-workspace.yaml

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync
    uses: theholocron/.github/.github/workflows/sync.yml@main
    secrets: inherit
