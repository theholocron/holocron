name: Sync

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - holocron.config.ts
      - package.json
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      steps:
        description: Sync steps to run (default: all)
        type: string
        required: false

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync
    uses: theholocron/.github/.github/workflows/sync.yml@main
    with:
      steps: ${{ inputs.steps }}
    secrets: inherit
