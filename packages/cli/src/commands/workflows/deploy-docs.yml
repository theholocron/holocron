name: Deploy Docs

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - docs/**
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Docs
    uses: theholocron/.github/.github/workflows/deploy.yml@main
    with:
      type: docs
    secrets: inherit
