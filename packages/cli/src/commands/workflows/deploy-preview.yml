name: Deploy Preview

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview
    uses: theholocron/.github/.github/workflows/deploy-preview.yml@main
    secrets: inherit
