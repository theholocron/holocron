name: Release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: theholocron/.github/.github/workflows/release.yml@main
    secrets: inherit
