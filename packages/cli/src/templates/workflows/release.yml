name: Release

# Semantic-release with OIDC Trusted Publishing.
# actions/setup-node writes a default NODE_AUTH_TOKEN=${{ github.token }}
# which shadows OIDC auth. We explicitly clear it so npm falls through to
# the Trusted Publisher OIDC exchange.
# The calling repo must have a .releaserc.json that configures branches,
# plugins, and any publish options. npm@11+ is installed to support OIDC.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      run-build:
        description: Run `pnpm build` before releasing
        type: boolean
        required: false
        default: true
      sentry-project:
        description: >
          Sentry project slug for sourcemap upload and release creation after
          publishing. Omit to skip the Sentry release step entirely.
        type: string
        required: false
        default: ""
    secrets:
      HOLOCRON_RELEASE_TOKEN:
        description: >
          Fine-grained PAT (Contents + Issues + Pull requests: write) owned by
          an admin. Required when the default branch is protected by a ruleset —
          github.token cannot push through rulesets, but an admin PAT can.
          Takes priority over HOLOCRON_SYNC_TOKEN. Falls back to github.token.
        required: false
      HOLOCRON_SYNC_TOKEN:
        description: >
          Legacy alias for HOLOCRON_RELEASE_TOKEN — kept for backward compatibility.
          Prefer HOLOCRON_RELEASE_TOKEN for new repos.
        required: false
      HOLOCRON_READ_TOKEN:
        description: >
          Fine-grained PAT for read-only GitHub API calls (e.g. resolving git
          committer identity via `gh api user`). Falls back to github.token.
        required: false
      GH_TOKEN:
        description: >
          Generic GitHub token fallback for `gh` CLI calls. Used when
          HOLOCRON_READ_TOKEN is not set.
        required: false
      SENTRY_AUTH_TOKEN:
        description: >
          Sentry auth token for sourcemap upload and release creation.
          Required when sentry-project is set. Use the org-level secret.
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  release:
    name: Semantic release
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    # Do not cancel in-progress releases — a partial release is worse than a slow one.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 0
          persist-credentials: false
          # Use HOLOCRON_RELEASE_TOKEN when available — git push (tags, release commits)
          # uses the checkout credential, not GITHUB_TOKEN env var. The
          # built-in github.token cannot push through branch protection rulesets.
          token: ${{ secrets.HOLOCRON_RELEASE_TOKEN || secrets.HOLOCRON_SYNC_TOKEN || github.token }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Configure git identity
        run: |
          GIT_NAME=$(gh api user --jq .name 2>/dev/null || echo "github-actions[bot]")
          GIT_EMAIL=$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"' 2>/dev/null || echo "41898282+github-actions[bot]@users.noreply.github.com")
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
          git config --global format.signoff true
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_READ_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11 sigstore
        # sigstore is required by libnpmpublish/provenance.js at module parse
        # time — before any config takes effect. Some npm 11.x builds stopped
        # bundling it; installing it globally into the same prefix ensures it
        # resolves regardless of npm version. (Discovered 2026-07-09.)

      - run: pnpm build
        name: Build
        if: ${{ inputs.run-build == true }}

      - run: npx semantic-release
        name: Release
        env:
          # Prefer HOLOCRON_RELEASE_TOKEN (fine-grained PAT, Contents+Issues+PRs write,
          # owned by an admin with ruleset bypass) so @semantic-release/git can
          # push the version-bump commit through branch protection. Falls back to
          # HOLOCRON_SYNC_TOKEN (legacy) then github.token for unprotected repos.
          GITHUB_TOKEN: ${{ secrets.HOLOCRON_RELEASE_TOKEN || secrets.HOLOCRON_SYNC_TOKEN || github.token }}
          HUSKY: "0"
          NPM_CONFIG_PROVENANCE: true

      - name: Get release version
        id: release_version
        if: ${{ inputs.sentry-project != '' }}
        env:
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            echo "release=${SENTRY_PROJECT}@${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry release
        if: ${{ inputs.sentry-project != '' && steps.release_version.outputs.release != '' }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: theholocron
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
        with:
          environment: production
          version: ${{ steps.release_version.outputs.release }}
          sourcemaps: "**/dist"
