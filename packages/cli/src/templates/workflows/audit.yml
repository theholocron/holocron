name: Audit

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      build-script:
        description: Script to build and upload bundle stats to Codecov
        type: string
        required: false
        default: pnpm build
      run-knip:
        description: Run Knip to detect unused files, exports, and dependencies
        type: boolean
        required: false
        default: false
      run-performance:
        description: Run Lighthouse CI performance audit (requires a lighthouse config file)
        type: boolean
        required: false
        default: false
      lighthouse-config:
        description: >
          Path to the Lighthouse CI config file passed as --config to lhci autorun.
          Defaults to lighthouse.config.cjs (the org standard).
        type: string
        required: false
        default: lighthouse.config.cjs
      knip-script:
        description: Script that invokes Knip (must exit non-zero on findings)
        type: string
        required: false
        default: pnpm run audit
    secrets:
      CODECOV_TOKEN:
        required: false
      LHCI_GITHUB_APP_TOKEN:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  bundle-size:
    name: Audit the bundle size
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: eval "$BUILD_SCRIPT"
        name: Build and upload bundle stats
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  knip:
    name: Knip
    if: ${{ inputs.run-knip }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          persist-credentials: false

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: eval "$KNIP_SCRIPT"
        name: Run Knip
        env:
          KNIP_SCRIPT: ${{ inputs.knip-script }}

  performance:
    name: Audit the performance
    if: ${{ inputs.run-performance }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: npm install -g @lhci/cli@0.14.x
        name: Install Lighthouse CLI

      - run: lhci autorun --config="$LIGHTHOUSE_CONFIG"
        name: Run Lighthouse CI
        env:
          LIGHTHOUSE_CONFIG: ${{ inputs.lighthouse-config }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
