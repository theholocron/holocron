name: ADR & spec check

on: # yamllint disable-line rule:truthy
  workflow_call:

jobs:
  validate:
    name: Validate ADR and spec frontmatter
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 2

      - name: Validate changed files
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD -- \
            'docs/architecture/adr/*.md' '.notes/*.spec.md' 2>/dev/null || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No ADR or spec files changed — running full validation"
            node scripts/validate-adrs.mjs
          else
            echo "Validating changed files: ${changed[*]}"
            node scripts/validate-adrs.mjs "${changed[@]}"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
