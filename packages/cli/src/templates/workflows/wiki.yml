name: Wiki

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      fern-version:
        description: >
          Fern CLI version to install. Pin this to avoid breaking changes when
          Fern updates their config schema.
        type: string
        required: false
        default: "5.35.4"
      preview:
        description: >
          When true, publishes a preview instead of production.
          Requires preview-id to be set.
        type: boolean
        required: false
        default: false
      preview-id:
        description: >
          Stable ID for the preview URL. The preview is accessible at
          {org}-preview-{id}.docs.buildwithfern.com. Use the PR number
          (e.g. "pr-123") so the same URL is reused on every push to
          the branch.
        type: string
        required: false
        default: ""
    secrets:
      HOLOCRON_FERN_TOKEN:
        required: true

jobs:
  publish:
    name: ${{ inputs.preview && 'Preview' || 'Publish' }} to Fern
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - name: Install Fern CLI
        run: npm install -g "fern-api@$FERN_VERSION"
        env:
          FERN_VERSION: ${{ inputs.fern-version }}

      - name: Publish docs
        if: ${{ !inputs.preview }}
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.HOLOCRON_FERN_TOKEN }}

      - name: Preview docs
        if: ${{ inputs.preview && inputs.preview-id != '' }}
        run: fern generate --docs --preview --id "$PREVIEW_ID"
        env:
          FERN_TOKEN: ${{ secrets.HOLOCRON_FERN_TOKEN }}
          PREVIEW_ID: ${{ inputs.preview-id }}
