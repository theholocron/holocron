name: Wiki

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      fern-version:
        description: >
          Fern CLI version to install. Pin this to avoid breaking changes when
          Fern updates their config schema.
        type: string
        required: false
        default: "5.35.4"
    secrets:
      FERN_TOKEN:
        required: true

jobs:
  publish:
    name: Publish to Fern
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - name: Install Fern CLI
        run: npm install -g "fern-api@$FERN_VERSION"
        env:
          FERN_VERSION: ${{ inputs.fern-version }}

      - name: Publish docs
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
