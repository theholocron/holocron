name: Tag

# Release Please — fully automated tag and GitHub Release from Conventional Commits.
# No package.json or npm publishing required. Operates in "simple" mode by default:
# analyzes commits since the last tag, maintains a rolling Release PR, and creates
# a tag + GitHub Release when that PR is merged.
#
# The calling repo must have two files at the root:
#   release-please-config.json    — declares packages and release-type
#   .release-please-manifest.json — tracks the current version

on: # yamllint disable-line rule:truthy
  # Self-trigger: when this workflow lives in theholocron/.github itself,
  # push to main runs Release Please for that repo's own releases.
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release-type:
        description: Release Please release type (simple, node, python, etc.)
        type: string
        required: false
        default: simple
      config-file:
        description: Path to release-please-config.json
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to .release-please-manifest.json
        type: string
        required: false
        default: .release-please-manifest.json

jobs:
  tag:
    name: Tag release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.1.1
        name: Run Release Please
        with:
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
