name: Post-release Sync

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      HOLOCRON_SYNC_TOKEN:
        required: false
      GH_TOKEN:
        description: >
          Generic GitHub token fallback for gh CLI calls. Used when
          HOLOCRON_SYNC_TOKEN is not set.
        required: false

jobs:
  broadcast:
    name: Broadcast readme sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger broadcast readme sync
        run: |
          gh workflow run sync-broadcast.yml \
            --repo theholocron/.github \
            --field "steps=readme"
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN }}
