name: Sync

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      steps:
        description: >
          Sync steps to run (default: all). Valid values:
          labels, properties, teams, topics, keywords, description, homepage, readme, workflows, wiki.
          Pass a space-separated list to run a subset, e.g. "readme" or "readme wiki".
        type: string
        required: false
    secrets:
      HOLOCRON_ADMIN_TOKEN:
        description: Fine-grained PAT with admin scopes (labels, properties, teams).
        required: false
      HOLOCRON_AXIOM_TOKEN:
        description: >
          Axiom API token. When set alongside the HOLOCRON_AXIOM_DATASET
          repo/org variable, the CLI ships this run's structured logs to Axiom.
          Falls back to the vendor-native AXIOM_TOKEN secret.
        required: false
      AXIOM_TOKEN:
        description: Vendor-native fallback for HOLOCRON_AXIOM_TOKEN.
        required: false
      HOLOCRON_DEPLOY_TOKEN:
        description: Fine-grained PAT for GitHub Pages configuration.
        required: false
      HOLOCRON_ISSUES_TOKEN:
        description: Fine-grained PAT for issue management.
        required: false
      HOLOCRON_ORG_TOKEN:
        description: Org-scoped fine-grained PAT for team sync and org properties.
        required: false
      HOLOCRON_READ_TOKEN:
        description: Fine-grained PAT for read-only GitHub API calls.
        required: false
      HOLOCRON_SYNC_TOKEN:
        required: false
      GH_TOKEN:
        description: >
          Generic GitHub token fallback for gh CLI calls. Used when
          HOLOCRON_SYNC_TOKEN is not set.
        required: false

jobs:
  sync:
    name: Sync repo from config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          token: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: pnpm build
        name: Build CLI

      - name: Run holocron sync
        # Call the built entry directly — `pnpm exec holocron` relies on a
        # node_modules/.bin/holocron symlink that pnpm cannot create at install
        # time (dist/ does not exist yet), same as sync-github.yml.
        run: |
          if [ -n "$STEPS" ]; then
            # shellcheck disable=SC2086
            node packages/cli/dist/cli.mjs sync --steps $STEPS
          else
            node packages/cli/dist/cli.mjs sync
          fi
        env:
          HOLOCRON_ADMIN_TOKEN: ${{ secrets.HOLOCRON_ADMIN_TOKEN }}
          HOLOCRON_AXIOM_TOKEN: ${{ secrets.HOLOCRON_AXIOM_TOKEN || secrets.AXIOM_TOKEN }}
          HOLOCRON_AXIOM_DATASET: ${{ vars.HOLOCRON_AXIOM_DATASET || vars.AXIOM_DATASET }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          HOLOCRON_DEPLOY_TOKEN: ${{ secrets.HOLOCRON_DEPLOY_TOKEN }}
          HOLOCRON_ISSUES_TOKEN: ${{ secrets.HOLOCRON_ISSUES_TOKEN }}
          HOLOCRON_ORG_TOKEN: ${{ secrets.HOLOCRON_ORG_TOKEN }}
          HOLOCRON_READ_TOKEN: ${{ secrets.HOLOCRON_READ_TOKEN }}
          HOLOCRON_SYNC_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN }}
          STEPS: ${{ inputs.steps }}

      - name: Format generated files
        run: |
          pnpm exec prettier --write README.md docs/src/content/docs/index.mdx 2>/dev/null || true
          # `holocron sync` writes package.json fields (keywords, description,
          # homepage) with a plain assignment, which appends new keys at the
          # end — re-apply the canonical order the lint config enforces.
          pnpm exec eslint --fix --no-warn-ignored package.json 2>/dev/null || true

      - uses: theholocron/.github/.github/actions/auto-commit@main
        id: auto-commit
        name: Commit sync changes
        with:
          token: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}
          branch: chore/auto-sync
          commit-message: "chore: sync from holocron.config"
          commit-options: "--no-verify"

      - name: Open PR if changes were committed
        if: steps.auto-commit.outputs.changes-detected == 'true'
        run: |
          gh pr create \
            --title "chore: sync README and repo metadata" \
            --body "Automated sync triggered by changes to config or package files. Merge to apply." \
            --base main \
            --head chore/auto-sync \
          || echo "PR already open — branch updated."
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Broadcast wiki sync if navbar changed
        if: >-
          steps.auto-commit.outputs.changes-detected == 'true' &&
          github.event_name == 'push' &&
          (inputs.steps == '' || contains(inputs.steps, 'wiki'))
        run: |
          if git diff HEAD~1 --name-only | grep -q 'fern/docs.yml'; then
            gh workflow run sync-dispatch.yml \
              --repo theholocron/.github \
              --field "steps=wiki" \
            || echo "skipping broadcast — insufficient permissions"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}
