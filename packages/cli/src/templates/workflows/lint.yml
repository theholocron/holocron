name: Lint

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      eslint-config:
        description: >
          Filename for the ESLint flat config used by super-linter for
          JavaScript, JSX, TSX, and TypeScript (ES) files. Defaults to
          eslint.config.ts (the org standard). Note: ESLint 9 requires
          --flag unstable_ts_config to load .ts configs; if super-linter
          cannot load it, override with eslint.config.mjs or eslint.config.js.
        type: string
        required: false
        default: eslint.config.ts
      prettier-config:
        description: >
          Filename for the Prettier config. Defaults to prettier.config.ts
          (the org standard). Prettier 3.x loads .ts configs natively.
        type: string
        required: false
        default: prettier.config.ts
      yaml-config:
        description: >
          Filename for the yamllint config. Defaults to yamllint.config.yml.
        type: string
        required: false
        default: yamllint.config.yml
      enable-auto-commit:
        description: >
          Auto-commit super-linter fixes as a verified commit via a GitHub App.
          Requires SUPER_LINTER_APP_ID and SUPER_LINTER_PRIVATE_KEY secrets.
        type: boolean
        required: false
        default: false
    secrets:
      SUPER_LINTER_APP_ID:
        required: false
      SUPER_LINTER_PRIVATE_KEY:
        required: false

jobs:
  super-lint:
    name: Lint entire codebase
    permissions:
      contents: write
      issues: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ID_SET: ${{ secrets.SUPER_LINTER_APP_ID != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Runs before checkout so the token is used as the checkout credential,
        # which makes the subsequent push go through the App and produce a
        # Verified commit. Skipped when auto-commit is disabled or secrets unset.
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUPER_LINTER_APP_ID }}
          private-key: ${{ secrets.SUPER_LINTER_PRIVATE_KEY }}

      - name: Resolve App bot identity
        id: app-bot
        # GitHub marks commits as Verified when the author email matches the
        # App bot's noreply address (<numeric-id>+<slug>[bot]@users.noreply.github.com).
        # The numeric ID must be fetched via the API — it differs from the App ID.
        # app-slug is passed via env rather than interpolated into the script to
        # prevent code injection (CWE-78).
        if: steps.app-token.conclusion == 'success'
        run: |
          BOT_SLUG="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_SLUG}" --jq .id)
          echo "name=${BOT_SLUG}" >> "$GITHUB_OUTPUT"
          echo "email=${BOT_ID}+${BOT_SLUG}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 0
          # Use the App token when available so the push credential is the App
          # bot — GitHub marks those commits as Verified automatically.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Detect project features
        # Writes VALIDATE_*/FIX_* to GITHUB_ENV only when the feature exists.
        # Also writes step outputs for values referenced in expression context
        # (GITHUB_ENV is not readable via steps.*.outputs — they need GITHUB_OUTPUT).
        # All values written are hardcoded 'true' — no user input in the script.
        # Config file paths (inputs.*) stay in GH Actions expression context in
        # the super-linter env: block below, never shell-evaluated (CWE-78).
        id: detect
        run: |
          has() { find . -not -path '*/node_modules/*' -name "$1" -print -quit 2>/dev/null | grep -q .; }

          if { has 'eslint.config.ts' || has 'eslint.config.mjs' || has 'eslint.config.js' || has '.eslintrc.json' || has '.eslintrc.yml'; }; then
            {
              echo "VALIDATE_JAVASCRIPT_ES=true"
              echo "VALIDATE_TYPESCRIPT_ES=true"
            } >> "$GITHUB_ENV"
            echo "eslint=true" >> "$GITHUB_OUTPUT"
          fi

          if { has '*.js' || has '*.jsx' || has '*.mjs' || has '*.cjs' || has '*.ts' || has '*.tsx'; }; then
            {
              echo "VALIDATE_JAVASCRIPT_PRETTIER=true"
              echo "VALIDATE_JSX_PRETTIER=true"
              echo "VALIDATE_TYPESCRIPT_PRETTIER=true"
              echo "VALIDATE_TSX=true"
              echo "FIX_JAVASCRIPT_PRETTIER=true"
              echo "FIX_JSX_PRETTIER=true"
              echo "FIX_TYPESCRIPT_PRETTIER=true"
              echo "FIX_TSX=true"
            } >> "$GITHUB_ENV"
          fi

          if { has '*.css' || has '*.scss' || has 'stylelint.config.ts' || has 'stylelint.config.mjs' || has 'stylelint.config.js'; }; then
            {
              echo "VALIDATE_CSS=true"
              echo "STYLELINT_CONFIG_FILE=stylelint.config.ts"
            } >> "$GITHUB_ENV"
          fi

          if { has '*.graphql' || has '*.gql'; }; then
            {
              echo "VALIDATE_GRAPHQL_PRETTIER=true"
              echo "FIX_GRAPHQL_PRETTIER=true"
            } >> "$GITHUB_ENV"
          fi

          if { has '*.html' || has '*.htm'; }; then
            {
              echo "VALIDATE_HTML_PRETTIER=true"
              echo "FIX_HTML_PRETTIER=true"
            } >> "$GITHUB_ENV"
          fi

          if { has '.env' || has '.env.example' || has '.env.local'; }; then
            {
              echo "VALIDATE_ENV=true"
              echo "FIX_ENV=true"
            } >> "$GITHUB_ENV"
          fi

          if { has 'Dockerfile' || has '*.Dockerfile'; }; then
            echo "VALIDATE_DOCKERFILE=true" >> "$GITHUB_ENV"
          fi

      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        name: Run Super Linter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          ANNOTATE_ONLY: true
          DISABLE_COMMENTS: false
          IGNORE_GITIGNORED_FILES: true
          LINTER_RULES_PATH: /
          EDITORCONFIG_FILE_NAME: ".editorconfig-checker.json"
          # Config file paths — inputs stay in expression context, never shell-evaluated.
          # When VALIDATE_JAVASCRIPT_ES is not set by detect, ESLint doesn't run so
          # the empty-string fallback (→ eslint.config.mjs in container) is safe.
          JAVASCRIPT_ES_CONFIG_FILE: ${{ steps.detect.outputs.eslint == 'true' && inputs.eslint-config || '' }}
          TYPESCRIPT_ES_CONFIG_FILE: ${{ steps.detect.outputs.eslint == 'true' && inputs.eslint-config || '' }}
          PRETTIER_CONFIG: ${{ inputs.prettier-config }}
          YAML_CONFIG_FILE: ${{ inputs.yaml-config }}
          # Always-on linters
          FIX_MARKDOWN_PRETTIER: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GIT_COMMITLINT: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_MARKDOWN_PRETTIER: true
          VALIDATE_YAML: true

      - name: Validate ADR and spec frontmatter
        if: hashFiles('scripts/validate-adrs.mjs') != ''
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD -- \
            'docs/decisions/*.md' '.notes/*.spec.md' 2>/dev/null || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            node scripts/validate-adrs.mjs
          else
            node scripts/validate-adrs.mjs "${changed[@]}"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Validate registry consistency
        if: hashFiles('scripts/validate-registry.mjs') != ''
        run: node scripts/validate-registry.mjs

      - name: Validate docs presence for new packages
        if: hashFiles('scripts/validate-docs-presence.mjs') != ''
        run: node scripts/validate-docs-presence.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - uses: theholocron/.github/.github/actions/auto-commit@main
        name: Commit and push linting fixes
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit-message: "chore: fix linting issues\n\nSigned-off-by: ${{ steps.app-bot.outputs.name }} <${{ steps.app-bot.outputs.email }}>"
          commit-options: "--no-verify"
          commit-user-name: ${{ steps.app-bot.outputs.name }}
          commit-user-email: ${{ steps.app-bot.outputs.email }}
          commit-author: "${{ steps.app-bot.outputs.name }} <${{ steps.app-bot.outputs.email }}>"


  conclusion:
    name: Conclusion
    runs-on: ubuntu-latest
    if: always()
    needs: [super-lint]
    steps:
      - name: Check job statuses
        run: |
          if [[ "$RESULTS" == *"failure"* ]] || [[ "$RESULTS" == *"cancelled"* ]]; then
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
