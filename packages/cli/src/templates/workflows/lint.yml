name: Lint

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      eslint-config:
        description: >
          Filename for the ESLint flat config used by super-linter for
          JavaScript, JSX, TSX, and TypeScript (ES) files. Defaults to
          eslint.config.ts (the org standard). Note: ESLint 9 requires
          --flag unstable_ts_config to load .ts configs; if super-linter
          cannot load it, override with eslint.config.mjs or eslint.config.js.
        type: string
        required: false
        default: eslint.config.ts
      prettier-config:
        description: >
          Filename for the Prettier config. Defaults to prettier.config.ts
          (the org standard). Prettier 3.x loads .ts configs natively.
        type: string
        required: false
        default: prettier.config.ts
      typescript-tsconfig:
        description: >
          tsconfig.json path passed to TYPESCRIPT_STANDARD_TSCONFIG_FILE.
          Defaults to tsconfig.json (super-linter's own default).
        type: string
        required: false
        default: tsconfig.json
      yaml-config:
        description: >
          Filename for the yamllint config. Defaults to yamllint.config.yml.
        type: string
        required: false
        default: yamllint.config.yml
      enable-auto-commit:
        description: >
          Auto-commit super-linter fixes as a verified commit via a GitHub App.
          Requires SUPER_LINTER_APP_ID and SUPER_LINTER_PRIVATE_KEY secrets.
        type: boolean
        required: false
        default: false
    secrets:
      SUPER_LINTER_APP_ID:
        required: false
      SUPER_LINTER_PRIVATE_KEY:
        required: false

jobs:
  super-lint:
    name: Lint entire codebase
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ID_SET: ${{ secrets.SUPER_LINTER_APP_ID != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Runs before checkout so the token is used as the checkout credential,
        # which makes the subsequent push go through the App and produce a
        # Verified commit. Skipped when auto-commit is disabled or secrets unset.
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUPER_LINTER_APP_ID }}
          private-key: ${{ secrets.SUPER_LINTER_PRIVATE_KEY }}

      - name: Resolve App bot identity
        id: app-bot
        # GitHub marks commits as Verified when the author email matches the
        # App bot's noreply address (<numeric-id>+<slug>[bot]@users.noreply.github.com).
        # The numeric ID must be fetched via the API — it differs from the App ID.
        # app-slug is passed via env rather than interpolated into the script to
        # prevent code injection (CWE-78).
        if: steps.app-token.conclusion == 'success'
        run: |
          BOT_SLUG="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_SLUG}" --jq .id)
          echo "name=${BOT_SLUG}" >> "$GITHUB_OUTPUT"
          echo "email=${BOT_ID}+${BOT_SLUG}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 0
          # Use the App token when available so the push credential is the App
          # bot — GitHub marks those commits as Verified automatically.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Detect project features
        # Only hardcoded patterns here — no user input in the run: script.
        # Inputs flow into super-linter solely via GH Actions expressions in
        # the env: block below, which are never shell-evaluated (CWE-78).
        id: detect
        run: |
          has() { find . -not -path '*/node_modules/*' -name "$1" -print -quit 2>/dev/null | grep -q .; }
          { has 'eslint.config.ts' || has 'eslint.config.mjs' || has 'eslint.config.js' || has '.eslintrc.json' || has '.eslintrc.yml'; } \
            && echo "eslint=true" >> "$GITHUB_OUTPUT" || echo "eslint=false" >> "$GITHUB_OUTPUT"
          { has '*.js' || has '*.jsx' || has '*.mjs' || has '*.cjs' || has '*.ts' || has '*.tsx'; } \
            && echo "js=true" >> "$GITHUB_OUTPUT" || echo "js=false" >> "$GITHUB_OUTPUT"
          { has '*.css' || has '*.scss' || has 'stylelint.config.ts' || has 'stylelint.config.mjs' || has 'stylelint.config.js'; } \
            && echo "css=true" >> "$GITHUB_OUTPUT" || echo "css=false" >> "$GITHUB_OUTPUT"
          { has '*.graphql' || has '*.gql'; } \
            && echo "graphql=true" >> "$GITHUB_OUTPUT" || echo "graphql=false" >> "$GITHUB_OUTPUT"
          { has '*.html' || has '*.htm'; } \
            && echo "html=true" >> "$GITHUB_OUTPUT" || echo "html=false" >> "$GITHUB_OUTPUT"
          { has '.env' || has '.env.example' || has '.env.local'; } \
            && echo "dotenv=true" >> "$GITHUB_OUTPUT" || echo "dotenv=false" >> "$GITHUB_OUTPUT"
          { has 'Dockerfile' || has '*.Dockerfile'; } \
            && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"

      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        name: Run Super Linter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          ANNOTATE_ONLY: true
          DISABLE_COMMENTS: false
          IGNORE_GITIGNORED_FILES: true
          LINTER_RULES_PATH: /
          EDITORCONFIG_FILE_NAME: ".editorconfig-checker.json"
          # When eslint=false the config falls back to '', which makes super-linter
          # use its built-in default (eslint.config.mjs) that ships in the container.
          # VALIDATE_JAVASCRIPT_ES/TYPESCRIPT_ES must be explicitly true/false.
          JAVASCRIPT_ES_CONFIG_FILE: ${{ steps.detect.outputs.eslint == 'true' && inputs.eslint-config || '' }}
          TYPESCRIPT_ES_CONFIG_FILE: ${{ steps.detect.outputs.eslint == 'true' && inputs.eslint-config || '' }}
          VALIDATE_JAVASCRIPT_ES: ${{ steps.detect.outputs.eslint == 'true' && 'true' || '' }}
          VALIDATE_TYPESCRIPT_ES: ${{ steps.detect.outputs.eslint == 'true' && 'true' || '' }}
          PRETTIER_CONFIG: ${{ inputs.prettier-config }}
          TYPESCRIPT_STANDARD_TSCONFIG_FILE: ${{ inputs.typescript-tsconfig }}
          YAML_CONFIG_FILE: ${{ inputs.yaml-config }}
          # Dynamic linters — empty string when off; super-linter only counts
          # non-empty VALIDATE_* values toward the allowlist/blocklist decision.
          FIX_JAVASCRIPT_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          FIX_JSX_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          FIX_TYPESCRIPT_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          FIX_TSX: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          VALIDATE_JAVASCRIPT_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          VALIDATE_JSX_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          VALIDATE_TSX: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          VALIDATE_TYPESCRIPT_PRETTIER: ${{ steps.detect.outputs.js == 'true' && 'true' || '' }}
          STYLELINT_CONFIG_FILE: ${{ steps.detect.outputs.css == 'true' && 'stylelint.config.ts' || '' }}
          VALIDATE_CSS: ${{ steps.detect.outputs.css == 'true' && 'true' || '' }}
          FIX_GRAPHQL_PRETTIER: ${{ steps.detect.outputs.graphql == 'true' && 'true' || '' }}
          VALIDATE_GRAPHQL_PRETTIER: ${{ steps.detect.outputs.graphql == 'true' && 'true' || '' }}
          FIX_HTML_PRETTIER: ${{ steps.detect.outputs.html == 'true' && 'true' || '' }}
          VALIDATE_HTML_PRETTIER: ${{ steps.detect.outputs.html == 'true' && 'true' || '' }}
          FIX_ENV: ${{ steps.detect.outputs.dotenv == 'true' && 'true' || '' }}
          VALIDATE_ENV: ${{ steps.detect.outputs.dotenv == 'true' && 'true' || '' }}
          VALIDATE_DOCKERFILE: ${{ steps.detect.outputs.docker == 'true' && 'true' || '' }}
          # Always-on linters
          FIX_MARKDOWN_PRETTIER: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GIT_COMMITLINT: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_MARKDOWN_PRETTIER: true
          VALIDATE_YAML: true

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        name: Commit and push linting fixes
        if: >
          inputs.enable-auto-commit == true &&
          github.event.pull_request != null &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.ref_name != github.event.repository.default_branch &&
          env.APP_ID_SET == 'true'
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore: fix linting issues\n\nSigned-off-by: ${{ steps.app-bot.outputs.name }} <${{ steps.app-bot.outputs.email }}>"
          commit_options: "--no-verify"
          commit_user_name: ${{ steps.app-bot.outputs.name }}
          commit_user_email: ${{ steps.app-bot.outputs.email }}
          commit_author: "${{ steps.app-bot.outputs.name }} <${{ steps.app-bot.outputs.email }}>"
