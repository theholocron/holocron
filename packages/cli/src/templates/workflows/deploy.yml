name: Deploy

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      type:
        description: "Type of deployment: docs or storybook"
        required: true
        type: string
      name:
        description: Repo name prefix used to filter the docs site package (<name>-site); omit to run pnpm -C docs build
        required: false
        type: string
        default: ""
      build-script:
        description: pnpm script that builds the Storybook static output (storybook type only)
        type: string
        required: false
        default: build:storybook
      output-dir:
        description: Directory where Storybook writes its static output (storybook type only)
        type: string
        required: false
        default: storybook-static

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build docs site
        if: ${{ inputs.type == 'docs' && inputs.name != '' }}
        env:
          SITE_NAME: ${{ inputs.name }}
        run: pnpm --filter @theholocron/"$SITE_NAME"-site build

      - name: Build docs site
        if: ${{ inputs.type == 'docs' && inputs.name == '' }}
        run: pnpm -C docs build

      - name: Build Storybook
        if: ${{ inputs.type == 'storybook' }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: pnpm run "$BUILD_SCRIPT"

      - name: Resolve artifact path
        id: artifact
        env:
          DEPLOY_TYPE: ${{ inputs.type }}
          STORYBOOK_OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          if [ "$DEPLOY_TYPE" = "docs" ]; then
            echo "path=docs/dist" >> "$GITHUB_OUTPUT"
          else
            echo "path=$STORYBOOK_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        name: Upload pages artifact
        with:
          path: ${{ steps.artifact.outputs.path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        name: Deploy to GitHub Pages
