name: Typecheck

on:
  workflow_call:
    inputs:
      typecheck-command:
        description: Command to run type checking
        type: string
        required: false
        default: pnpm typecheck

jobs:
  typecheck:
    name: tsc --noEmit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - run: ${{ inputs.typecheck-command }}
        name: Type check
