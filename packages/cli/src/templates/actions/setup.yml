name: Setup
description: Prepare the environment and install project dependencies.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22.x"
  registry-url:
    description: npm registry URL — set to https://registry.npmjs.org/ for OIDC publishing
    required: false
    default: ""

runs:
  using: composite

  steps:
    - uses: theholocron/.github/.github/actions/setup-node@main
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - uses: theholocron/.github/.github/actions/install@main

    - name: Cache Turbo artifacts
      if: ${{ hashFiles('turbo.json') != '' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
