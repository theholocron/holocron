info:
  name: Signed, no effect
  type: folder
  seq: 2

request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require("crypto-js");
        // Signs the body exactly as it is sent: HMAC-SHA256 under SENTINEL_WEBHOOK_SECRET, as `sha256=<hex>`.
        const secret = bru.getEnvVar("webhookSecret");
        if (!secret) throw new Error("Set webhookSecret in the environment (the dev App's webhook secret).");
        const body = bru.interpolate(req.getBody().raw);
        const digest = CryptoJS.HmacSHA256(body, secret).toString(CryptoJS.enc.Hex);
        req.setHeader("X-Hub-Signature-256", "sha256=" + digest);

docs:
  content: "Valid deliveries Sentinel reads and then ignores or only acknowledges: no check, comment or post is made."
  type: text/markdown
