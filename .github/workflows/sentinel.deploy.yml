# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/sentinel.deploy.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Sentinel's own CI-based deploy (holocron#800). NOT astromech-templated —
# this repo owns Sentinel directly (apps/sentinel/), so this workflow is
# hand-maintained here rather than generated + synced to theholocron/.github
# for other repos to use.
#
# Two triggers, not a replacement of the local `pnpm run delivery.deploy`
# path (apps/sentinel/README.md's own "Deploying" section still applies
# for a from-source-checkout deploy):
#   - `workflow_dispatch` — manual, on demand, no local Vercel credentials
#     or local build needed.
#   - `push` to `main` (not `alpha`) touching `apps/sentinel/**` — this
#     repo's stable/prerelease split (CLAUDE.md's Releases section) means
#     Sentinel only redeploys once work is promoted to the stable channel,
#     not on every alpha merge. `main`'s branch protection only allows
#     squash-merges, so this `push` trigger only ever fires on a real merge.
#
# `pnpm run delivery.deploy` (build → stage → `holocron deploy`) stays the
# actual mechanism this invokes — the same command a human runs locally,
# per D8's "one engine" convention.
#
# Alpha releases deploy themselves (holocron#928, #930): the Delivery
# workflow's Deploy job runs `holocron deploy on-release` after the release
# job, deploying Sentinel's `delivery.deploy` task (`on: "release"` in its
# holocron.config.ts) once every package has published. This workflow stays
# for manual redeploys and stable `main` merges.
name: Sentinel Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "apps/sentinel/**"
  workflow_dispatch: {}

concurrency:
  group: sentinel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - name: Build, stage, and deploy
        working-directory: apps/sentinel
        run: pnpm run delivery.deploy
