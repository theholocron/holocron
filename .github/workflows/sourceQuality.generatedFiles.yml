# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/sourceQuality.generatedFiles.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Generated files (#1405): fails when a file `holocron repo setup` / `holocron repo sync` writes from the config
# differs from the committed copy, differs the second time it is generated, or when a workflow in .github/workflows is
# neither generated nor marked "# HAND-MAINTAINED". Checked by `holocron probe generated check`, which needs no token.
#
# Required: "Generated files / Check" is in `extraRequiredChecks` in holocron.config.ts, so `holocron repo setup`
# adds it to the ruleset. There is deliberately no `paths:` filter: a required check that is skipped blocks the merge.
#
# The job's name is the whole status ("Generated files / Check"): GitHub reports a job that runs steps under its own
# name only, and adds the workflow name just for a job that calls a reusable workflow (see
# sourceQuality.dependencyCatalogs.yml).
name: Generated files

on: # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Generated files / Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build the CLI
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      - name: Check the generated files
        run: node cli/cli/dist/cli.mjs probe generated check
