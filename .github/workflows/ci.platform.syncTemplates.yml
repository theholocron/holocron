name: Platform

# Calls the reusable in this repo (./.github/workflows/platform.syncTemplates.yml), generated from ci/workflows/, so a PR
# that edits it runs the edit. What it pushes to theholocron/.github is built from the same sources.
on: # yamllint disable-line rule:truthy
  push:
    # main only — this publishes to theholocron/.github, consumed by every
    # other repo's CI. alpha is the prerelease channel; publishing from it
    # would let unreleased/unstable template changes overwrite what main
    # just published, the same stable-vs-prerelease split this org already
    # enforces for npm's dist-tags and Sentinel's own deploy trigger.
    branches: [main]
    paths:
      - ci/**
      - cli/astromech/src/templates/**
      - cli/astromech/src/generators/**
      - cli/astromech/src/registry/**
      - cli/cli/src/templates/**
  workflow_dispatch: {}

concurrency:
  group: sync-templates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-templates:
    name: Sync Templates
    # workflow_dispatch can target ANY ref, not only main — without this,
    # anyone able to dispatch this workflow (a broader group than who can
    # push to main) could run it against an arbitrary branch, checking out
    # and building that ref's own code with the sync token present, then
    # publishing that ref's templates to theholocron/.github.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/platform.syncTemplates.yml
    secrets: inherit
