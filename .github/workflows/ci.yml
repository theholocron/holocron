name: CI

# The one stable required check (spec ci-flat-task-vocabulary, "The aggregate required check", issue #1613). It polls the
# Checks API for the head SHA until every expected id has a check run named `<id> / ...` and all of them have
# completed, and the `codecov/*` commit statuses have reached success, or the timeout passes. An id that never posted
# fails as "never posted". The job summary lists every expected check with a link, failing ones first.
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      expected:
        description: JSON array of check ids; each must have a check run whose name starts with `<id> / `.
        type: string
        required: true
      statuses:
        description: JSON array of commit-status contexts (`codecov/patch`, ...) that must reach success.
        type: string
        required: false
        default: "[]"
      timeout-minutes:
        description: How long to wait for the expected checks before failing the ones still missing.
        type: number
        required: false
        default: 30
      interval-seconds:
        description: Seconds between two polls.
        type: number
        required: false
        default: 30

permissions:
  checks: read
  statuses: read
  contents: read

jobs:
  ci:
    # The check is `<caller job> / <called job>`, so with the caller job `ci` the required context is
    # `ci / Required checks`.
    name: Required checks
    permissions:
      checks: read
      statuses: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for the expected checks
        run: |
          set -euo pipefail
          # Never wait for ourselves: this run is `ci / Required checks`, which an expected `ci` would match.
          expected=$(jq -c 'map(select(. != "ci"))' <<<"$EXPECTED")
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          timed_out=false

          while :; do
            runs=$(gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion, url: .html_url}' | jq -s '.')
            posted=$(gh api "repos/${REPO}/commits/${SHA}/status?per_page=100" \
              --jq '.statuses | map({context, state, url: .target_url})')

            rows=$(jq -n -c \
              --argjson expected "$expected" --argjson wanted "$STATUSES" \
              --argjson runs "$runs" --argjson posted "$posted" --argjson timed_out "$timed_out" '
              def ok: . == "success" or . == "skipped" or . == "neutral";
              def row($id; $kind; $state; $detail; $url): {id: $id, kind: $kind, state: $state, detail: $detail, url: $url};
              def expire($r):
                if $timed_out and $r.state == "pending" then $r | .state = "failure" | .detail = "timed out while still running"
                else $r end;
              ($expected | map(. as $id
                | ($runs | map(select(.name | startswith($id + " / ")))) as $found
                | ($found | map(select(.status != "completed"))) as $open
                | ($found | map(select(.status == "completed" and ((.conclusion // "") | ok | not)))) as $bad
                | if ($found | length) == 0 then row($id; "check"; "missing"; "never posted"; null)
                  elif ($open | length) > 0 then expire(row($id; "check"; "pending"; "still running"; $open[0].url))
                  elif ($bad | length) > 0 then row($id; "check"; "failure"; ($bad[0].conclusion // "none"); $bad[0].url)
                  else row($id; "check"; "success"; $found[0].conclusion; $found[0].url) end))
              + ($wanted | map(. as $context
                | ($posted | map(select(.context == $context)) | .[0]) as $s
                | if $s == null then row($context; "status"; "missing"; "never posted"; null)
                  elif $s.state == "pending" then expire(row($context; "status"; "pending"; "still pending"; $s.url))
                  elif $s.state == "success" then row($context; "status"; "success"; "success"; $s.url)
                  else row($context; "status"; "failure"; $s.state; $s.url) end))')

            unsettled=$(jq 'map(select(.state == "pending" or .state == "missing")) | length' <<<"$rows")
            if [ "$unsettled" -eq 0 ] || [ "$timed_out" = true ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              timed_out=true
              continue
            fi
            sleep "$INTERVAL"
          done

          failing=$(jq -r 'map(select(.state != "success") | .id) | join(", ")' <<<"$rows")
          total=$(jq 'length' <<<"$rows")

          summary() {
            echo "## ci"
            echo
            echo "| Check | Result | Link |"
            echo "| --- | --- | --- |"
            jq -r '
              def rank: {"failure": 0, "missing": 1, "pending": 2, "success": 3}[.state];
              sort_by(rank)[]
              | "| `\(.id)` | \(if .state == "success" then "pass" else "FAIL" end): \(.detail) | \(if .url then "[open](\(.url))" else "none" end) |"' <<<"$rows"
            if [ -n "$failing" ]; then
              echo
              echo "Re-running one failed check does not update this one: re-run **ci** as well."
            fi
          }
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then summary >> "$GITHUB_STEP_SUMMARY"; else summary; fi

          # Colons and commas in an annotation title must be escaped.
          jq -r '.[] | select(.state != "success")
            | "::error title=\(.id | gsub(":"; "%3A") | gsub(","; "%2C"))::\(.detail) \(.url // "")"' <<<"$rows"

          if [ -n "$failing" ]; then
            echo "ci failed: ${failing}" >&2
            exit 1
          fi
          echo "ci passed: all ${total} expected checks are green."
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED: ${{ inputs.expected }}
          STATUSES: ${{ inputs.statuses }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          INTERVAL: ${{ inputs.interval-seconds }}
