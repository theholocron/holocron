name: Security

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      language:
        description: CodeQL language to analyze
        type: string
        required: false
        default: javascript-typescript

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Do not cancel in-progress security scans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        name: Initialize CodeQL
        with:
          languages: ${{ inputs.language }}

      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        name: Autobuild

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        name: Analyze
        with:
          category: /language:${{ inputs.language }}
