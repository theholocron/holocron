# Hand-maintained — not generated by `holocron repo sync`. Checkly's own
# monitoring-as-code model (checkly.config.ts + __checks__/*.check.ts,
# deployed via its own CLI) doesn't fit the task-manifest/thin-caller
# pattern the rest of this directory uses, and there's exactly one
# package using it today — see packages/sentinel/checkly.config.ts for why
# this isn't a holocron capability/plugin either.
name: Checkly

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - alpha
    paths:
      - packages/sentinel/checkly.config.ts
      - packages/sentinel/__checks__/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Checkly checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Deploy checks
        working-directory: packages/sentinel
        run: pnpm exec checkly deploy --force
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
