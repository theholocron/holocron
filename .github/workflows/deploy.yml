name: Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - docs/**
      - astro.config.ts
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - docs/**
      - astro.config.ts
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-preview-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' }}
    uses: theholocron/.github/.github/workflows/deploy.yml@main
    with:
      type: docs
    secrets: inherit

  preview:
    name: Deploy Preview
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    uses: theholocron/.github/.github/workflows/deploy-preview.yml@main
    with:
      type: docs
      cloudflare-project: theholocron-preview
    secrets: inherit

  cleanup:
    name: Clean up Preview
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    uses: theholocron/.github/.github/workflows/cleanup-preview.yml@main
    with:
      cloudflare-project: theholocron-preview
    secrets: inherit
