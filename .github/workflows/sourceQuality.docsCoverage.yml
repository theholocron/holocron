# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/sourceQuality.docsCoverage.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Doc-comment coverage of the public API (#1368), measured with the repo's TypeDoc by `holocron probe docs coverage`
# and uploaded to Codecov as the `documentation` flag (`--lcov`). The patch and project percentages show on every PR
# next to the test coverage as `codecov/patch/documentation` and `codecov/project/documentation`, and Codecov fails
# the patch status when a PR adds or changes an exported function, class, interface, type, constant or member of one
# without a doc comment; old undocumented exports do not count against a PR. Pushes to `alpha` upload it too, so a PR
# has a base report to compare against.
#
# The required check is `codecov/patch/documentation` (`extraRequiredChecks` in holocron.config.ts, written into the
# ruleset by `holocron repo setup`). This job's own check, "Docs coverage / Patch", is not required and no longer
# gates: the probe step that failed it was dropped once the flag had posted reliably (#1511). `holocron probe docs
# patch` stays in the CLI to run before pushing.
name: Docs coverage

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [alpha]

permissions:
  contents: read

jobs:
  patch:
    name: Patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The Codecov upload authenticates with the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build the CLI
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      # One TypeDoc pass over every package writes the report for the upload below. It does not fail on an
      # undocumented export: the Codecov status does.
      - name: Measure the documentation coverage
        run: node cli/cli/dist/cli.mjs probe docs coverage --lcov coverage/docs.lcov

      # A pull request from a fork has no OIDC token to upload with, so Codecov has nothing to gate it on.
      - name: Upload the documentation coverage to Codecov
        if: >-
          ${{ !cancelled() && hashFiles('coverage/docs.lcov') != '' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: theholocron/.github/.github/actions/codecov-upload@main
        with:
          uploads: '[{"flag":"documentation","files":"coverage/docs.lcov"}]'
