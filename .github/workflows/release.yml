# AUTO-GENERATED — do not edit directly.
# Source:  theholocron/holocron · ci/workflows/release.yml
# Tool:    holocron sync
# Changes: edit source in theholocron/holocron
# Source package: .

name: Release

# Semantic-release with OIDC Trusted Publishing.
# actions/setup-node writes a default NODE_AUTH_TOKEN=${{ github.token }}
# which shadows OIDC auth. We explicitly clear it so npm falls through to
# the Trusted Publisher OIDC exchange.
# The calling repo must have a .releaserc.json that configures branches,
# plugins, and any publish options. npm@11+ is installed to support OIDC.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      dry-run:
        description: >
          When true, runs semantic-release --dry-run: analyzes commits and
          previews the next release without git writes or publish. Only
          meaningful for workflow_dispatch triggers; push-triggered runs
          always run fully.
        type: boolean
        required: false
        default: false
      group:
        description: >
          Version group to release: a folder of the repo (`clients`,
          `observability`). Passed to the release config as RELEASE_GROUP, and
          scopes every tag lookup below to that group's `<group>-v*` tags, so
          releasing one group never reads another's. Empty releases the whole
          repo, with plain `v*` tags. Groups push release commits to the same
          branch, so release them one at a time (a matrix with `max-parallel: 1`);
          each run starts from the branch's current tip, not the commit that
          triggered the workflow.
        type: string
        required: false
        default: ""
      from-branch-tip:
        description: >
          When true, an ungrouped release starts from the branch's current tip
          instead of the commit that triggered the workflow. Set it when the
          repo-wide release runs after the version groups, whose release
          commits have moved the branch (semantic-release refuses to run
          behind its remote). A group always starts from the tip.
        type: boolean
        required: false
        default: false
      post-release:
        description: >
          When true, dispatches a readme sync broadcast after a successful
          release. Enable for packages consumed by other repos via the
          registry-doc system so downstream README installation blocks
          stay current.
        type: boolean
        required: false
        default: false
      run-build:
        description: Run `pnpm build` before releasing
        type: boolean
        required: false
        default: true
      deploy-on-release:
        description: >
          When true, runs a separate `deploy` job after a successful release
          (holocron#930): `holocron deploy on-release` deploys every workspace
          package whose `delivery.deploy` task is `with: { on: release }`, when
          the release is on its channel and changes its paths. The job is its
          own check, re-runnable on its own, and gets VERCEL_TOKEN; the release
          job never sees it. Off by default, so a repo that doesn't deploy from
          its release never exposes the token.
        type: boolean
        required: false
        default: false
      republish-tag:
        description: >
          Publish what npm lacks for an existing release instead of releasing
          (holocron#1387): the tag of the release, `<group>-v<version>` for a
          version group or `v<version>` for the rest. Set, the `release` job is
          skipped (no semantic-release, no tag, no release commit) and the
          `republish` job checks the tag out and runs `publish package
          --skip-already-published` for it. The tag must be on a release branch.
          The caller sets it from a manual run only. Empty is a normal release.
        type: string
        required: false
        default: ""
      exclude-groups:
        description: >
          Space-separated version groups that release on their own, left out of
          a republish of the repo-wide tag (`v<version>`). Ignored otherwise.
        type: string
        required: false
        default: ""
      sentry-project:
        description: >
          Sentry project slug for sourcemap upload and release creation after
          publishing. Omit to skip the Sentry release step entirely.
        type: string
        required: false
        default: ""
    secrets:
      HOLOCRON_RELEASE_TOKEN:
        description: >
          Fine-grained PAT (Contents + Issues + Pull requests: write) owned by
          an admin. Required when the default branch is protected by a ruleset —
          github.token cannot push through rulesets, but an admin PAT can.
          Takes priority over HOLOCRON_SYNC_TOKEN. Falls back to github.token.
        required: false
      HOLOCRON_SYNC_TOKEN:
        description: >
          Legacy alias for HOLOCRON_RELEASE_TOKEN — kept for backward compatibility.
          Prefer HOLOCRON_RELEASE_TOKEN for new repos.
        required: false
      HOLOCRON_READ_TOKEN:
        description: >
          Fine-grained PAT for read-only GitHub API calls (e.g. resolving git
          committer identity via `gh api user`). Falls back to github.token.
        required: false
      GH_TOKEN:
        description: >
          Generic GitHub token fallback for `gh` CLI calls. Used when
          HOLOCRON_READ_TOKEN is not set.
        required: false
      HOLOCRON_SENTRY_RELEASE_TOKEN:
        description: The Sentry release token (sourcemaps and release creation). Read first; the SENTRY_AUTH_TOKEN secret is the fallback.
        required: false
      SENTRY_AUTH_TOKEN:
        description: >
          Sentry auth token for sourcemap upload and release creation.
          Required when sentry-project is set. Use the org-level secret.
        required: false
      HOLOCRON_TURBO_TOKEN:
        description: The Turbo remote cache token. Read first; the TURBO_TOKEN secret is the fallback.
        required: false
      TURBO_TOKEN:
        required: false
      HOLOCRON_VERCEL_TOKEN:
        description: The Vercel token. Read first; the vendor-native VERCEL_TOKEN secret is the fallback.
        required: false
      VERCEL_TOKEN:
        description: >
          Vercel token for the deploy job. Only used when deploy-on-release is
          true, and only by that job.
        required: false

jobs:
  release:
    name: Semantic release
    if: ${{ inputs.republish-tag == '' }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Read by the deploy job (holocron#930). Empty unless semantic-release
      # published: `commit` is the release commit, `previous` the commit of
      # the release before it (to diff against), `channel` the new version's
      # prerelease identifier (`alpha`), empty for a stable release (`main`).
      commit: ${{ steps.release.outputs.commit }}
      previous: ${{ steps.release.outputs.previous }}
      channel: ${{ steps.release.outputs.channel }}
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    # Do not cancel in-progress releases — a partial release is worse than a slow one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0
          persist-credentials: false
          # A group's release commit moves the branch, so a later group's run must
          # release from the branch's current tip, not the commit that triggered the
          # workflow (semantic-release refuses to run behind its remote). Ungrouped,
          # the default (the triggering commit) is unchanged, unless `from-branch-tip`
          # says the groups ran first.
          ref: ${{ (inputs.group != '' || inputs.from-branch-tip) && github.ref || github.sha }}
          # Use HOLOCRON_RELEASE_TOKEN when available — git push (tags, release commits)
          # uses the checkout credential, not GITHUB_TOKEN env var. The
          # built-in github.token cannot push through branch protection rulesets.
          token: ${{ secrets.HOLOCRON_RELEASE_TOKEN || secrets.HOLOCRON_SYNC_TOKEN || github.token }}

      # semantic-release 26 needs Node 26.13 or later. The frozen setup action ignores `.node-version` (its expression
      # always falls through to this input, default 22.x), so the version is passed here.
      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup
        with:
          node-version: "26.x"

      # By path: the action is new and `theholocron/.github` is frozen (see the `format` action in lint/code.yml).
      - uses: ./ci/actions/git-identity
        name: Configure git identity
        with:
          scope: global
          resolve: "true"
          signoff: "true"
          token: ${{ secrets.HOLOCRON_READ_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11 sigstore
        # sigstore is required by libnpmpublish/provenance.js at module parse
        # time — before any config takes effect. Some npm 11.x builds stopped
        # bundling it; installing it globally into the same prefix ensures it
        # resolves regardless of npm version. (Discovered 2026-07-09.)

      - run: pnpm build
        name: Build
        if: ${{ inputs.run-build == true }}

      - name: Release
        id: release
        run: |
          BEFORE=$(git rev-parse HEAD)
          # A group's tags are `<group>-v<version>`; without one, the repo-wide `v<version>` tags only: a
          # `deployed/<package>` tag (the deploy step's marker) is nearer after a deploy and is not a release.
          MATCH=(--match "v[0-9]*")
          PREFIX="v"
          if [ -n "$RELEASE_GROUP" ]; then
            MATCH=(--match "${RELEASE_GROUP}-v*")
            PREFIX="${RELEASE_GROUP}-v"
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${MATCH[@]}" 2>/dev/null || true)
          PREVIOUS=""
          if [ -n "$PREVIOUS_TAG" ]; then PREVIOUS=$(git rev-list -n 1 "$PREVIOUS_TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
          AFTER=$(git rev-parse HEAD)
          # semantic-release only commits (`chore(release): … [skip ci]`) when it
          # actually publishes. That commit gets no CI (and so no coverage
          # upload), which makes the next PR's `codecov/project` compare a full
          # report against a stale ancestor — a phantom drop (holocron#644).
          # Emit the new SHA so the steps below upload coverage for it.
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "commit=$AFTER" >> "$GITHUB_OUTPUT"
            echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
            # The new version's channel: the prerelease identifier of its tag
            # (v5.0.0-alpha.108 or cli-v5.0.0-alpha.108 -> alpha), empty for a stable release.
            VERSION=$(git describe --tags --abbrev=0 "${MATCH[@]}")
            VERSION=${VERSION#"$PREFIX"}
            CHANNEL=""
            case "$VERSION" in *-*) PRE=${VERSION#*-}; CHANNEL=${PRE%%.*} ;; esac
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          fi
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          # Read by the repo's release config to release one version group.
          RELEASE_GROUP: ${{ inputs.group }}
          # Prefer HOLOCRON_RELEASE_TOKEN (fine-grained PAT, Contents+Issues+PRs write,
          # owned by an admin with ruleset bypass) so @semantic-release/git can
          # push the version-bump commit through branch protection. Falls back to
          # HOLOCRON_SYNC_TOKEN (legacy) then github.token for unprotected repos.
          GITHUB_TOKEN: ${{ secrets.HOLOCRON_RELEASE_TOKEN || secrets.HOLOCRON_SYNC_TOKEN || github.token }}
          HUSKY: "0"
          NPM_CONFIG_PROVENANCE: true

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Coverage for the release commit
        if: ${{ steps.release.outputs.commit != '' }}
        with:
          task: test:unit

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        name: Upload release-commit coverage to Codecov
        if: ${{ steps.release.outputs.commit != '' }}
        # fail_ci_if_error makes a failed upload fail this step, so it is visible, but
        # continue-on-error keeps it from failing the job: the release has already
        # published, and the Sentry release steps below must still run (holocron#934).
        continue-on-error: true
        with:
          use_oidc: true
          fail_ci_if_error: true
          override_commit: ${{ steps.release.outputs.commit }}
          override_branch: ${{ github.ref_name }}

      - name: Get release version
        id: release_version
        if: ${{ inputs.sentry-project != '' && inputs.dry-run != true }}
        env:
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
          RELEASE_GROUP: ${{ inputs.group }}
        run: |
          MATCH=(--match "v[0-9]*")
          PREFIX="v"
          if [ -n "$RELEASE_GROUP" ]; then
            MATCH=(--match "${RELEASE_GROUP}-v*")
            PREFIX="${RELEASE_GROUP}-v"
          fi
          TAG=$(git describe --tags --abbrev=0 "${MATCH[@]}" 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            echo "release=${SENTRY_PROJECT}@${TAG#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry release
        if: ${{ inputs.sentry-project != '' && steps.release_version.outputs.release != '' && inputs.dry-run != true }}
        uses: getsentry/action-release@2e505a70ff06dac263413242aa3617fec90134e5 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.HOLOCRON_SENTRY_RELEASE_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.HOLOCRON_SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
        with:
          environment: production
          version: ${{ steps.release_version.outputs.release }}
          sourcemaps: "**/dist"

  republish:
    name: Republish
    # Publishes what npm lacks for a tag that already exists (holocron#1387). Never tags, never makes a release or a
    # release commit, never moves a branch: it reads the tag and publishes. It holds no write token for the repository.
    if: ${{ inputs.republish-tag != '' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ inputs.republish-tag }}
          RELEASE_GROUP: ${{ inputs.group }}
          EXCLUDED_GROUPS: ${{ inputs.exclude-groups }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # A group's tags are `<group>-v<version>`; the rest of the repo's are `v<version>`.
          PREFIX="v"
          if [ -n "$RELEASE_GROUP" ]; then PREFIX="${RELEASE_GROUP}-v"; fi
          case "$TAG" in
            "$PREFIX"[0-9]*) ;;
            *) echo "::error::$TAG is not a ${PREFIX}<version> tag"; exit 1 ;;
          esac
          VERSION=${TAG#"$PREFIX"}
          # The channel is the prerelease identifier (5.0.0-alpha.9 -> alpha), `latest` for a stable version.
          CHANNEL=latest
          case "$VERSION" in *-*) PRE=${VERSION#*-}; CHANNEL=${PRE%%.*} ;; esac
          ARGS="--skip-already-published --tag $CHANNEL"
          if [ -n "$RELEASE_GROUP" ]; then
            ARGS="$ARGS --group $RELEASE_GROUP"
          else
            for g in $EXCLUDED_GROUPS; do ARGS="$ARGS --exclude-group $g"; done
          fi
          # A manual run defaults to a dry run, so a republish is previewed before it publishes.
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout the tag
        with:
          ref: refs/tags/${{ inputs.republish-tag }}
          fetch-depth: 0
          persist-credentials: false

      # Only a tag on a release branch is republished: a tag pushed to some other branch is not a release.
      - name: Require a release branch
        env:
          TAG: ${{ inputs.republish-tag }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/alpha:refs/remotes/origin/alpha' || true
          for branch in main alpha; do
            if git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null && git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
              echo "$TAG is on $branch"
              exit 0
            fi
          done
          echo "::error::$TAG is not on main or alpha, so it is not republished"
          exit 1

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11 sigstore

      - run: pnpm build
        name: Build
        if: ${{ inputs.run-build == true }}

      # Writes the packages left unpublished to the job summary and fails when one is.
      - uses: theholocron/.github/.github/actions/holocron@main
        name: Publish what npm lacks
        env:
          NPM_CONFIG_PROVENANCE: true
        with:
          command: publish package
          args: ${{ steps.tag.outputs.args }}

  deploy:
    name: Deploy
    needs: release
    # Only after a release that actually published (`commit` is empty on a dry
    # run or when nothing was released). A failed deploy fails only this job:
    # the release is already on npm, and this job re-runs on its own.
    if: ${{ inputs.deploy-on-release == true && inputs.dry-run != true && needs.release.outputs.commit != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout the release commit
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          # No credential is left in .git/config: the deploy script below runs with VERCEL_TOKEN and must not find a
          # write token. Only the record step at the end is given one (holocron#2330).
          persist-credentials: false

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Deploy packages that deploy on release
        env:
          VERCEL_TOKEN: ${{ secrets.HOLOCRON_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        with:
          command: deploy on-release
          args: >-
            --channel=${{ needs.release.outputs.channel }}
            --from=${{ needs.release.outputs.previous }}
            --to=${{ needs.release.outputs.commit }}
            --record-file=${{ runner.temp }}/deployed.json

      # Records each package that deployed as a `deployed/<package>` tag, so a later release can make up a deploy this
      # one missed (holocron#2330). It runs even after a failed deploy (for the packages that did deploy), deploys
      # nothing, and is the only step that gets the job's token, in its own environment and never in .git/config.
      - uses: theholocron/.github/.github/actions/holocron@main
        name: Record the deploys
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: deploy on-release
          args: >-
            --record
            --record-file=${{ runner.temp }}/deployed.json

  sync-readme:
    name: Post-release readme sync
    needs: release
    if: ${{ inputs.post-release == true && inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger broadcast readme sync
        run: |
          gh workflow run sync-dispatch.yml \
            --repo "$GITHUB_REPOSITORY_OWNER/.github" \
            --field "steps=readme"
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN }}
