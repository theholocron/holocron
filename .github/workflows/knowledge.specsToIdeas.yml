# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/knowledge.specsToIdeas.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Posts to #ideas on Discord when a pull request opens, gets a push, or merges a spec (`.notes/*.spec.md` and
# `docs/wiki/specifications/*.spec.md`), so spec work is seen by more than the repo's watchers (#1534, epic #1160).
#
# What is worth a post, and what it says, is decided by `holocron probe specs announce`, whose rules are in
# `@theholocron/astromech/repo-validation` and are tested there. This file only maps the event to its inputs and sends
# the result through the repo's own `notify` action (`./ci/actions/notify`, not the copy in theholocron/.github).
#
# - A pull request that opens (or reopens) announces every spec it adds or edits, or whose `status` it changes.
# - A further push announces only a spec it adds or a `status` it changes, so a typo fix is quiet.
# - A merge into the default branch announces the specs it landed.
#
# `pull_request_target` so that a pull request from a fork can reach the webhook secret. That is safe only because
# nothing from the pull request is run: the checkout is the base branch, the action and the CLI are the base
# branch's, and the pull request's files are read with `git show` as text. Keep it that way: never check out the
# head, and never put a value from the event into a `run:` script except through `env:`.
#
# The webhook is the org secret `HOLOCRON_NOTIFY_WEBHOOK_IDEAS`, made by `holocron notifications setup` for the
# `ideas` channel of the layout. Without it the job warns and posts nothing. A rerun of a run posts nothing again,
# because the notify action has no way to tell it already posted (#1102).
name: Specs to ideas

on: # yamllint disable-line rule:truthy
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    paths:
      - ".notes/*.spec.md"
      - "docs/wiki/specifications/*.spec.md"

permissions:
  contents: read

# One run per pull request at a time, in order: a push that lands while an earlier run is posting waits for it.
concurrency:
  group: specs-to-ideas-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  announce:
    name: Announce
    # A closed pull request is only news when it was merged into the default branch.
    if: >-
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WEBHOOK: ${{ secrets.HOLOCRON_NOTIFY_WEBHOOK_IDEAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout the base branch
        with:
          fetch-depth: 0

      # The pull request's commits as objects only, so `git show` can read its files. Nothing from it is checked out.
      - name: Fetch the pull request's commits
        if: github.event.action != 'closed'
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build the CLI
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      # What the event compares. A push compares the head before and after it. A merge compares the merged commit with
      # its first parent, which is exactly what the pull request changed. A pull request that opens compares its head
      # with the point where it branched, so changes made to the default branch since do not count as its own.
      - name: Work out what the event changed
        id: range
        run: |
          case "$ACTION" in
            closed)
              event=merged
              before="${MERGE_SHA}^1"
              after="$MERGE_SHA"
              ;;
            synchronize)
              event=updated
              before="$PUSH_BEFORE"
              after="$PUSH_AFTER"
              ;;
            *)
              event=opened
              before=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
              after="$HEAD_SHA"
              ;;
          esac
          {
            echo "event=$event"
            echo "before=$before"
            echo "after=$after"
          } >> "$GITHUB_OUTPUT"
        env:
          ACTION: ${{ github.event.action }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Decide what to post
        id: specs
        run: node cli/cli/dist/cli.mjs probe specs announce
        env:
          SPEC_EVENT: ${{ steps.range.outputs.event }}
          BEFORE_SHA: ${{ steps.range.outputs.before }}
          AFTER_SHA: ${{ steps.range.outputs.after }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Warn that the ideas channel has no webhook
        if: steps.specs.outputs.post == 'true' && env.WEBHOOK == ''
        run: |
          echo "::warning::HOLOCRON_NOTIFY_WEBHOOK_IDEAS is not set (run 'holocron notifications setup'), so nothing was posted to #ideas."

      - name: Say that a rerun posts nothing
        if: steps.specs.outputs.post == 'true' && github.run_attempt > 1
        run: |
          echo "::notice::This is attempt ${{ github.run_attempt }}; the post was made (or tried) on the first, so it is not repeated."

      - uses: ./ci/actions/notify
        name: Post to the ideas channel
        if: steps.specs.outputs.post == 'true' && github.run_attempt == 1
        with:
          webhook: ${{ env.WEBHOOK }}
          message: ${{ steps.specs.outputs.message }}
