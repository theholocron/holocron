# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/knowledge.specsToIdeas.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Keeps a forum post in #ideas for every ADR and spec, in step with the files (#1535, spec
# `tech-specs-discussion-threads`). It runs `holocron specs sync`, which makes the posts (titled `SPEC:` or `ADR:`, tagged
# with the status), writes each post's address into its file as `discussion.url`, and, when a gatekeeper changed a post's
# tag, changes the file's `status:` line. Those are edits to the working tree only: this workflow commits them to the
# branch `chore/specs-sync` and opens one pull request, so a status change reaches `alpha` only through a review.
#
# - Every hour, so a retag becomes a pull request within the hour.
# - When a spec or ADR lands on `alpha`, so its post exists straight away.
# - On demand, with `dry_run` to see what a run would do. A first run is the backfill: run it as a dry run, then for real.
#
# It needs the org secret `HOLOCRON_DISCORD_BOT_TOKEN` (the Holonet bot) and a forum channel in the layout. Without the
# token the job warns and does nothing. The pull request is opened with `HOLOCRON_SYNC_TOKEN` when there is one, so its
# checks run; with the default token they do not, and the pull request needs a push to start them.
#
# This replaces the webhook post of #1534: a forum rejects a plain webhook post, and a post per document says more than a
# line per pull request. A spec in a pull request that has not merged has no post yet.
name: Spec discussions

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [alpha]
    paths:
      - ".notes/*.spec.md"
      - "docs/wiki/specifications/*.spec.md"
      - "docs/wiki/decisions/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would be made or changed; make and write nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, however it was started: two runs at once could each make a post for the same document.
concurrency:
  group: spec-discussions
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    if: github.repository == 'theholocron/holocron'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      HOLOCRON_DISCORD_BOT_TOKEN: ${{ secrets.HOLOCRON_DISCORD_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}
      BRANCH: chore/specs-sync
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Warn that there is no Discord token
        if: env.HOLOCRON_DISCORD_BOT_TOKEN == ''
        run: |
          echo "::warning::HOLOCRON_DISCORD_BOT_TOKEN is not set, so no spec discussions were synced. Add it as an Actions secret."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout the default branch
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''
        with:
          token: ${{ secrets.HOLOCRON_SYNC_TOKEN || secrets.GH_TOKEN || github.token }}
          # The whole history: a spec is numbered by when its file was first committed, and its post links the pull
          # request that added it, which the first commit's subject names.
          fetch-depth: 0

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''

      - name: Build the CLI
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      - name: Sync the discussions
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node cli/cli/dist/cli.mjs specs sync --dry-run
          else
            node cli/cli/dist/cli.mjs specs sync
          fi

      # The command changes the files and never commits. What it changed goes to one branch, force-updated each run, so
      # there is at most one open pull request for it.
      - name: Commit the edits to the sync branch
        id: commit
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != '' && env.DRY_RUN != 'true'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit: every post and file is in step."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A .notes docs/wiki
          git commit --no-verify -s -m "chore(specs): 🔄 sync spec discussions"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          # An open pull request already carries the new commit: the branch was updated in place.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "The sync pull request is open; its branch now has the latest edits."
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          Edits `holocron specs sync` made to the working tree: the address of each spec or ADR discussion post as `discussion.url`, and the `status:` of a document whose post a gatekeeper retagged.

          A status change here was asked for by changing the tag on the post in Discord. Merge it to accept the change, or close it and change the tag back. The post is not marked as in step until this merges.

          Opened by the Spec discussions workflow (#1535).
          EOF
          gh pr create --base alpha --head "$BRANCH" \
            --title "chore(specs): 🔄 sync spec discussions" \
            --body-file "$RUNNER_TEMP/body.md"
