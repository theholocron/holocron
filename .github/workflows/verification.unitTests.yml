name: Test

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      affected:
        description: Run only the packages changed since the PR base, plus their dependents (turbo --affected). Needs a turbo.json; checks out full history. Other repos keep today's behaviour while this is false.
        type: boolean
        required: false
        default: false
      uploads:
        description: 'JSON list of {"flag", "files"} to upload one Codecov flag per group, e.g. [{"flag":"utils","files":"utils/*/coverage/lcov.info"}]. Empty uploads all coverage as one report, as before.'
        type: string
        required: false
        default: ""
      run-unit:
        description: Run unit tests with coverage (disable for UI-only repos that use Storybook testing exclusively)
        type: boolean
        required: false
        default: true
      run-storybook:
        description: Run Storybook vitest interaction tests (requires .storybook/ setup)
        type: boolean
        required: false
        default: false
      run-interaction:
        description: Run Storybook interaction and accessibility tests with Playwright
        type: boolean
        required: false
        default: false
      run-user-flow:
        description: Run Cypress E2E user-flow tests (requires cypress.config.*)
        type: boolean
        required: false
        default: false
      wait-on-url:
        description: URL to wait for before running Cypress tests (default is Vite dev server; override for non-Vite stacks e.g. http://localhost:3000 for Next.js)
        type: string
        required: false
        default: "http://localhost:5173"
    secrets:
      CYPRESS_RECORD_KEY:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  unit:
    name: Run unit tests and collect coverage
    if: ${{ inputs.run-unit }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          # --affected needs the base commit, which a depth-1 checkout does not have.
          fetch-depth: ${{ inputs.affected && '0' || '1' }}

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - uses: theholocron/holocron/ci/actions/holocron@ci-v1
        name: Run tests with coverage
        with:
          task: verification.unitTests
          affected: ${{ inputs.affected }}

      # With `affected`, a run that selects nothing (a README-only PR) writes no coverage. The two
      # required Codecov statuses still have to post, so say so with an empty upload instead of
      # failing the upload. Without `affected` a missing report stays an error.
      - id: reports
        name: Look for coverage and test reports
        if: ${{ inputs.affected }}
        shell: bash
        run: |
          # find, not hashFiles('**/…'): hashFiles walks node_modules and can time out in a large workspace.
          has() { [ -n "$(find . -path ./node_modules -prune -o -path '*/node_modules' -prune -o -name "$1" -print -quit)" ]; }
          has lcov.info && echo "coverage=true" >> "$GITHUB_OUTPUT" || echo "coverage=false" >> "$GITHUB_OUTPUT"
          has test-report.junit.xml && echo "tests=true" >> "$GITHUB_OUTPUT" || echo "tests=false" >> "$GITHUB_OUTPUT"

      # A Codecov upload must not fail silently. fail_ci_if_error makes a failed
      # upload fail this step (the action's default is to log the error and pass),
      # which fails the job and so the `Test / Conclusion` check. Whether that
      # blocks a merge is up to whether the check is required, not this workflow
      # (holocron#934).
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload coverage to Codecov
        if: ${{ inputs.uploads == '' && (!inputs.affected || steps.reports.outputs.coverage == 'true') }}
        with:
          use_oidc: true
          fail_ci_if_error: true

      # One upload per group, each with its own flag, so Codecov can carry the unchanged groups forward.
      - id: flags
        name: Upload coverage to Codecov, one flag per group
        if: ${{ inputs.uploads != '' }}
        uses: theholocron/holocron/ci/actions/codecov-upload@ci-v1
        with:
          uploads: ${{ inputs.uploads }}
          allow-empty: ${{ inputs.affected }}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload test results to Codecov
        if: ${{ !cancelled() && (!inputs.affected || steps.reports.outputs.tests == 'true') }}
        with:
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          files: "**/test-report.junit.xml"

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Post the Codecov statuses without a report
        if: ${{ inputs.affected && (inputs.uploads == '' && steps.reports.outputs.coverage != 'true' || inputs.uploads != '' && steps.flags.outputs.uploaded == '0') }}
        with:
          use_oidc: true
          fail_ci_if_error: true
          run_command: empty-upload

  storybook:
    name: Run Storybook interaction tests
    if: ${{ inputs.run-storybook }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - run: pnpm exec playwright install chromium --with-deps
        name: Install Playwright

      - run: pnpm test:storybook
        name: Run Storybook tests

      # A Codecov upload must not fail silently. fail_ci_if_error makes a failed
      # upload fail this step (the action's default is to log the error and pass),
      # which fails the job and so the `Test / Conclusion` check. Whether that
      # blocks a merge is up to whether the check is required, not this workflow
      # (holocron#934).
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload coverage to Codecov
        with:
          use_oidc: true
          fail_ci_if_error: true

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          files: "**/test-report.junit.xml"

  interaction-and-accessibility:
    name: Run interactions and accessibility tests
    if: ${{ inputs.run-interaction }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - run: pnpm exec playwright install --with-deps
        name: Install Playwright

      - run: pnpm test:storybook
        name: Run interaction and accessibility tests

  user-flow:
    name: Run user flow tests
    if: ${{ inputs.run-user-flow }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - run: pnpm exec cypress install
        name: Install Cypress binary

      - uses: cypress-io/github-action@1052aa98bbbe4f55210f844878213c07d9c8c399 # v6.7.13
        name: Cypress run
        with:
          start: pnpm dev
          wait-on: ${{ inputs.wait-on-url }}
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conclusion:
    name: Conclusion
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, storybook, interaction-and-accessibility, user-flow]
    steps:
      - name: Check job statuses
        run: |
          if [[ "$RESULTS" == *"failure"* ]] || [[ "$RESULTS" == *"cancelled"* ]]; then
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
