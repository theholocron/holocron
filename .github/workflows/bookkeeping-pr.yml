name: PR Bookkeeping

# Applies labels to PRs based on changed files + head branch name —
# powered by .github/labeler.yml.
#
# @TODO: add in more things like:
# - [ ] auto-assigning,
# - [ ] project assignments,
# - [ ] milestone assignments
# - [ ] cleans up language
# - [ ] checks that template is filled out

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize # re-label when more commits land on the PR

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    name: Add labels to PRs
    runs-on: ubuntu-latest
    steps:
      # The previous workflow used `github/issue-labeler` — wrong action
      # (it's an ISSUE labeler, expects regex strings in the config) +
      # ran on deprecated Node 20. `.github/labeler.yml` is in the
      # `actions/labeler` format (file globs + head-branch patterns),
      # so this is what it always should have been.
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          sync-labels: true
          configuration-path: .github/labeler.yml
