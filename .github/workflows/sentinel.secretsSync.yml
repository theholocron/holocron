# Sentinel's secrets sync (holocron#781, extended here per holocron#800) —
# manual only, matching the local "run once after registration, again only
# when a secret rotates" design (packages/sentinel/README.md's "After
# registration" section). NOT astromech-templated, same reason as
# sentinel.deploy.yml — this repo owns Sentinel directly.
#
# Fans Doppler's `sentinel`/prd config out to Vercel (all 5 keys) and to the
# one GH-Actions-consumed key at org scope (`SENTINEL_AXIOM_INGEST_TOKEN` —
# `theholocron/.github`'s `platform.dispatchedCheck.yml` reads it, org-wide
# since any repo with Bucket 2 dispatch enabled needs it, not just this
# repo). See packages/sentinel/README.md's "After registration" section for
# the equivalent local invocation and why each flag is there.
name: Sentinel Secrets Sync

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      environment:
        description: Doppler environment/config id to sync from.
        required: false
        default: prd
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync Doppler to Vercel to GH org secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.SENTINEL_DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Sync secrets
        with:
          command: secrets
          args: >-
            sync ${{ inputs.environment }} --cwd packages/sentinel --project-id sentinel
            --target production --github-secret SENTINEL_AXIOM_INGEST_TOKEN
            --github-secret-scope org=theholocron --org theholocron
            --token github=${{ secrets.HOLOCRON_SECRETS_TOKEN }}
