# Changes: edit this file and open a PR.
#
# Sentinel's secrets sync (holocron#781, extended here per holocron#800) —
# manual only, matching the local "run once after registration, again only
# when a secret rotates" design (apps/sentinel/README.md's "After
# registration" section). NOT astromech-templated, same reason as
# sentinel.deploy.yml — this repo owns Sentinel directly.
#
# Fans Doppler's `sentinel`/prd config out to Vercel (all 5 keys) and to the
# one GH-Actions-consumed key at org scope (`SENTINEL_AXIOM_INGEST_TOKEN` —
# `theholocron/.github`'s `platform.dispatchedCheck.yml` reads it, org-wide
# since any repo with Bucket 2 dispatch enabled needs it, not just this
# repo). See apps/sentinel/README.md's "After registration" section for
# the equivalent local invocation and why each flag is there.
#
# `--target production` only, deliberately. A prior version of this
# workflow (holocron#1010 follow-up, merged via #1024) added
# `--target preview` reasoning that delivery.previewDeploy's preview
# function needed these 5 env vars too — it doesn't:
# handleWebhookRequest (apps/sentinel/src/handler/handler.ts) returns
# 405 on anything but POST before it ever reads `env`, and the preview
# monitoring check only ever sends a GET. That version ran for real on
# 2026-10-14 and synced all 5 keys, GITHUB_APP_PRIVATE_KEY included,
# into Vercel's `preview` target — reachable by any PR's own deployed
# code, since `delivery.previewDeploy` builds every PR to this repo's
# preview from that PR's own, not-yet-reviewed code. `secrets sync`'s
# `deployment` destination has no per-key allowlist (unlike `secrets`/
# GH-Actions below, which does via `--github-secret`), so there's no
# way to sync only the safe subset to preview — keeping production
# credentials out of a PR-controlled deploy target entirely is the fix
# (same class of exposure #1057/#1058 closed for the Vercel Deployment
# Protection bypass secret). Caught by sourcery review on #1059 before
# merge; the already-synced preview copies were manually cleared from
# Vercel directly.
name: Sentinel Secrets Sync

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      environment:
        description: Doppler environment/config id to sync from.
        required: false
        default: prd
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync Doppler to Vercel to GH org secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.SENTINEL_DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/holocron/ci/actions/setup@ci-v1
        name: Setup

      - uses: theholocron/holocron/ci/actions/holocron@ci-v1
        name: Sync secrets
        with:
          command: secrets
          args: >-
            sync ${{ inputs.environment }} --cwd apps/sentinel --project-id sentinel
            --target production --github-secret SENTINEL_AXIOM_INGEST_TOKEN
            --github-secret-scope org=theholocron --org theholocron
            --token github=${{ secrets.HOLOCRON_SECRETS_TOKEN }}
