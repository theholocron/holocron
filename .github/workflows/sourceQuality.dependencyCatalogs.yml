# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/sourceQuality.dependencyCatalogs.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Dependency catalogs (#1380): fails when a workspace package.json breaks the catalog rule written at the top of
# pnpm-workspace.yaml (a hard-coded version, a workspace package pinned to a version, a dependency in the wrong
# catalog or an unused catalog entry). Checked by `holocron probe deps check`, which reads the manifests live.
#
# Required: "Dependency catalogs / Check" is in `extraRequiredChecks` in holocron.config.ts, so
# `holocron repo setup` adds it to the ruleset. There is deliberately no `paths:` filter: a required check
# that is skipped blocks the merge.
name: Dependency catalogs

on: # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          fetch-depth: 0

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build the CLI
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      - name: Check the dependency catalogs
        run: node cli/cli/dist/cli.mjs probe deps check
