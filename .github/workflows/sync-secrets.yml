name: Sync Secrets

# Sentinel's secrets sync (holocron#781, extended per holocron#800): fans the 1Password Environment `Sentinel`
# (holocron#1671; it was Doppler's `sentinel`/prd config) out to Vercel (all 5 keys) and to the one GH-Actions-consumed
# key at org scope (`SENTINEL_AXIOM_INGEST_TOKEN`, which `theholocron/.github`'s `platform.dispatchedCheck.yml` reads,
# org-wide since any repo with Bucket 2 dispatch enabled needs it). apps/sentinel/README.md's "After registration"
# section has the equivalent local invocation and says why each flag is there. The caller is manual only: run it once
# after registration and again when a secret rotates.
#
# `--target production` only, deliberately. A prior version also synced `--target preview` (holocron#1010 follow-up,
# #1024), reasoning that deploy-preview's function needed the 5 env vars; it does not (`handleWebhookRequest` returns
# 405 on anything but POST before it reads `env`, and the preview monitoring check only sends a GET). That version ran
# on 2026-10-14 and synced all 5 keys, `GITHUB_APP_PRIVATE_KEY` included, into Vercel's `preview` target, reachable by
# any PR's own deployed code, since `deploy-preview` builds every PR from that PR's not-yet-reviewed code. `secrets
# sync`'s `deployment` destination has no per-key allowlist (unlike `secrets`/GH-Actions below, which has
# `--github-secret`), so keeping production credentials out of a PR-controlled deploy target entirely is the fix (the
# class of exposure #1057/#1058 closed for the Deployment Protection bypass secret). The already-synced preview copies
# were cleared from Vercel by hand.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      environment:
        description: 1Password Environment (name or id) to sync from.
        required: false
        default: Sentinel
        type: string
    secrets:
      HOLOCRON_VERCEL_TOKEN:
        description: The Vercel token the sync writes with. `VERCEL_TOKEN` is the fallback.
        required: false
      VERCEL_TOKEN:
        required: false
      SENTINEL_OP_SERVICE_ACCOUNT_TOKEN:
        description: A 1Password service account with read access to the `Sentinel` Environment.
        required: true
      HOLOCRON_SECRETS_TOKEN:
        description: The GitHub token that writes the org secret, in place of a person's `gh auth token`.
        required: true

jobs:
  sync-secrets:
    name: Sync 1Password to Vercel to GH org secret
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.HOLOCRON_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SENTINEL_OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        name: Install the 1Password CLI

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Sync secrets
        with:
          command: secrets
          args: >-
            sync ${{ inputs.environment }} --cwd apps/sentinel --project-id sentinel
            --target production --github-secret SENTINEL_AXIOM_INGEST_TOKEN
            --github-secret-scope org=${{ github.repository_owner }} --org ${{ github.repository_owner }}
            --token github=${{ secrets.HOLOCRON_SECRETS_TOKEN }}
