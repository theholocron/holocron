name: Delivery

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — analyze commits and preview the release without git writes
          or publish. Push-triggered runs always run fully; this only applies
          to manual workflow_dispatch triggers.
        required: false
        default: true
        type: boolean
      group:
        description: >
          Release one version group instead of all of them. Push-triggered
          runs always release everything.
        required: false
        default: all
        type: choice
        options:
          - all
          - ungrouped
          - observability
          - skills
          - utils
          - clients
          - configs

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ inputs.group == '' || inputs.group == 'all' || inputs.group == 'ungrouped' }}
    uses: theholocron/.github/.github/workflows/delivery.publish.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true }}
      sentry-project: holocron-cli
      deploy-on-release: true
    secrets: inherit

  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - id: plan
        name: Choose the groups to release
        env:
          GROUP: ${{ inputs.group }}
          ALL_GROUPS: '[{"group":"observability"},{"group":"skills"},{"group":"utils"},{"group":"clients"},{"group":"configs"}]'
        run: |
          if [ -n "$GROUP" ] && [ "$GROUP" != "all" ]; then
            groups=$(jq -c --arg group "$GROUP" '[.[] | select(.group == $group)]' <<<"$ALL_GROUPS")
          else
            groups=$ALL_GROUPS
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  release-groups:
    name: Release ${{ matrix.group }}
    # after the ungrouped release, which pushes its own commit first; still run if it failed or was skipped.
    # Choosing `ungrouped` by hand leaves the plan empty, and a matrix with no entries fails the run.
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    uses: theholocron/.github/.github/workflows/delivery.publish.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true }}
      group: ${{ matrix.group }}
    secrets: inherit
