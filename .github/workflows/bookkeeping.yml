name: Bookkeeping

# Labels both PRs and issues from a single config (.github/labeler.yml)
# powered by srvaroa/labeler. PR-only signals (files / branch) are
# simply ignored when the event is an issue; title regex covers both.
#
# @TODO: add in more things like:
# - [ ] auto-assigning,
# - [ ] project assignments,
# - [ ] milestone assignments
# - [ ] cleans up language
# - [ ] checks that template is filled out

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize # re-label when more commits land on the PR
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      # srvaroa/labeler — Docker-based action that supports a unified
      # config schema covering both PRs (files / branch / title) and
      # issues (title / body). One config, two event types.
      #
      # SHA-pinned per CodeQL's "unpinned 3rd-party action" rule; tag
      # comment lets humans (+ dependabot) see what version this is.
      - uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config_path: .github/labeler.yml
