# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/platform.notifications.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Tells Discord about the runs nobody is watching (#1159, epic #1160):
#
# - A workflow that fails on `alpha` or `main` (not a pull request) posts to #alerts and pings the gatekeepers. A failed
#   Deploy, Preview, Preview Deploy, Preview Check or Sentinel Deploy goes to #deploys instead. The daily Token Expiry run is in the
#   list, so a token close to expiring reaches #alerts the day it is found.
#   The post names the failing jobs of that run with links (five at most, then "and N more"), read with `actions: read`
#   (#1614); when they cannot be read the post is just the run's line.
# - A deploy, preview or Preview Check that succeeds posts to #deploys too (#1578), on any branch and for a pull
#   request, so the channel shows every deploy and not only the broken ones. That is deliberately noisy; narrow the
#   `deployed` job's `if` to dial it back.
# - A release (the Delivery run of `delivery.publish.yml`) that succeeds posts the tags it made to #releases. The tags
#   come from git, not from GitHub releases: a package line (`clients-v*`, `utils-v*`) is tagged but has no release.
#
# The runs are named for their caller (`Verification`, `Delivery`, …), so the file name is in the message and a release
# is told from the other Delivery runs by its file. Repo sync is left out, because it posts its own result, and so is
# this workflow, so a failure here cannot loop. `workflow_run` only fires from the default branch, so a change to this
# file takes effect once it is on `alpha`. A missing webhook secret skips the post and never fails the run.
name: Notifications

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows:
      - Verification
      - Source Quality
      - Security
      - Delivery
      - Platform
      - Knowledge
      - Token Expiry
      - Deploy
      - Preview
      - Sentinel Deploy
      - Spec discussions
    types: [completed]

permissions: {}

jobs:
  failed:
    name: Notify of a failed run
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      !endsWith(github.event.workflow_run.path, 'platform.repoSync.yml') &&
      contains(fromJSON('["alpha","main"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    env:
      WORKFLOW: ${{ github.event.workflow_run.name }}
      FILE: ${{ github.event.workflow_run.path }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      URL: ${{ github.event.workflow_run.html_url }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Word the message
        id: message
        run: |
          retry=""
          if [ "$ATTEMPT" -gt 1 ]; then retry=" (attempt $ATTEMPT)"; fi
          text="❌ ${GITHUB_REPOSITORY}: $WORKFLOW (${FILE##*/}) failed on $BRANCH — $URL$retry"
          # The jobs of this attempt that failed, five at most, then "and N more". A name loses its brackets and is cut
          # to 80 characters, so the message stays inside Discord's 2000. If the jobs cannot be read, or none failed
          # (a cancelled run), the message is the line above.
          failed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" 2>/dev/null |
            jq -r '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] as $f
              | ($f[:5][] | "• [\(.name | gsub("[\\[\\]\r\n]"; " ") | .[:80])](<\(.html_url)>)"),
                (if ($f | length) > 5 then "and \($f | length - 5) more" else empty end)' 2>/dev/null) || failed=""
          {
            echo "text<<HOLOCRON_EOF"
            echo "$text"
            if [ -n "$failed" ]; then
              echo "Failed jobs:"
              echo "$failed"
            fi
            echo "HOLOCRON_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: theholocron/.github/.github/actions/notify@main
        name: "Notify #deploys"
        if: ${{ contains(fromJSON('["Deploy","Preview","Sentinel Deploy"]'), github.event.workflow_run.name) || endsWith(github.event.workflow_run.path, 'delivery.previewDeploy.yml') || endsWith(github.event.workflow_run.path, 'delivery.previewCheck.yml') }}
        with:
          webhook: ${{ secrets.HOLOCRON_NOTIFY_WEBHOOK_DEPLOYS }}
          message: ${{ steps.message.outputs.text }}

      - uses: theholocron/.github/.github/actions/notify@main
        name: "Notify #alerts"
        if: ${{ !(contains(fromJSON('["Deploy","Preview","Sentinel Deploy"]'), github.event.workflow_run.name) || endsWith(github.event.workflow_run.path, 'delivery.previewDeploy.yml') || endsWith(github.event.workflow_run.path, 'delivery.previewCheck.yml')) }}
        with:
          webhook: ${{ secrets.HOLOCRON_NOTIFY_WEBHOOK_ALERTS }}
          mention: ${{ secrets.HOLOCRON_NOTIFY_ALERT_ROLE }}
          message: ${{ steps.message.outputs.text }}

  deployed:
    name: Notify of a deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (contains(fromJSON('["Deploy","Preview","Sentinel Deploy"]'), github.event.workflow_run.name) ||
      endsWith(github.event.workflow_run.path, 'delivery.previewDeploy.yml') ||
      endsWith(github.event.workflow_run.path, 'delivery.previewCheck.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WORKFLOW: ${{ github.event.workflow_run.name }}
      FILE: ${{ github.event.workflow_run.path }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
      URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Word the message
        id: message
        run: |
          where="on $BRANCH"
          if [ "$EVENT" = "pull_request" ]; then where="for a pull request ($BRANCH)"; fi
          echo "text=✅ ${GITHUB_REPOSITORY}: $WORKFLOW (${FILE##*/}) succeeded $where — $URL" >> "$GITHUB_OUTPUT"

      - uses: theholocron/.github/.github/actions/notify@main
        name: "Notify #deploys"
        with:
          webhook: ${{ secrets.HOLOCRON_NOTIFY_WEBHOOK_DEPLOYS }}
          message: ${{ steps.message.outputs.text }}

  released:
    name: Notify of a release
    if: >-
      endsWith(github.event.workflow_run.path, 'delivery.publish.yml') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      STARTED: ${{ github.event.workflow_run.run_started_at }}
      URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find the tags this run made
        id: tags
        run: |
          git fetch --quiet --tags --force origin
          since=$(date -d "$STARTED" +%s)
          # The newest first, and only those created after the run began.
          list=$(git for-each-ref --sort=-creatordate --format='%(creatordate:unix) %(refname:short)' refs/tags |
            awk -v since="$since" '$1 >= since { print $2 }' | head -10 | paste -sd ' ' -)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Tags since $STARTED: ${list:-none}"

      - uses: theholocron/.github/.github/actions/notify@main
        name: "Notify #releases"
        if: ${{ steps.tags.outputs.list != '' }}
        with:
          webhook: ${{ secrets.HOLOCRON_NOTIFY_WEBHOOK_RELEASES }}
          message: "🚀 ${{ github.repository }}: released ${{ steps.tags.outputs.list }} — ${{ env.URL }}"
