name: Holocron Setup

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - alpha
      - main
    paths:
      # Everything `astromech.reusableTemplates()` (→ `holocron sync github`)
      # reads. `templates/**` covers the reusable workflow_call impls + composite
      # actions (`reusable/`) and the thin-caller bases (`workflows/`).
      - cli/astromech/src/templates/**
      - cli/astromech/src/generators/github-action-reusable-workflows/**
      - cli/astromech/src/generators/github-action-thin-callers/**
      - cli/cli/src/commands/sync/**
  workflow_dispatch:

jobs:
  discover-repos:
    name: Discover consumer repos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      secondary-repos: ${{ steps.find.outputs.secondary-repos }}
    steps:
      - name: Find repos with holocron.config
        id: find
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # $ENV.OWNER is jq's, read from the environment; the single quotes are meant.
          # shellcheck disable=SC2016
          repos=$(gh api "search/code?q=filename:holocron.config+org:${OWNER}&per_page=100" \
            --jq '[.items[].repository.full_name]
                  | unique
                  | map(select(. != ($ENV.OWNER + "/.github") and . != ($ENV.OWNER + "/holocron")))
                  | join(" ")')
          echo "secondary-repos=$repos" >> "$GITHUB_OUTPUT"

  sync-templates:
    name: Sync workflow templates
    needs: discover-repos
    uses: theholocron/.github/.github/workflows/sync-github.yml@main
    with:
      primary-repo: ${{ github.repository_owner }}/.github
      secondary-repos: ${{ needs.discover-repos.outputs.secondary-repos }}
    secrets:
      HOLOCRON_SYNC_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN }}
