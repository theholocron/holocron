name: Unit tests

# vitest run --coverage across every workspace. Coverage artifacts
# uploaded so the HTML/LCOV reports are reachable from the run page.
#
# Code Quality per-workspace uploads + per-workspace gating (the
# pattern Rando uses) are deliberately NOT here yet — file a
# follow-up if you want them once the monorepo has more contributors.

on:
  push:
    branches-ignore:
      - main # release.yml runs the same tests before publishing
  pull_request:
    branches:
      - main

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vitest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          FORCE_COLOR: '1'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/*/coverage
          retention-days: 14
          if-no-files-found: warn
