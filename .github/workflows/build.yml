name: Build

# Sanity check that every workspace actually compiles to dist/ — doesn't
# upload or publish anything. delivery.publish builds again before
# publishing; this just answers "does it build?" on every push/PR.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      affected:
        description: Run only the packages changed since the PR base, plus their dependents (turbo --affected). Needs a turbo.json; checks out full history. Other repos keep today's behaviour while this is false.
        type: boolean
        required: false
        default: false
    secrets:
      HOLOCRON_TURBO_TOKEN:
        description: The Turbo remote cache token. Read first; the TURBO_TOKEN secret is the fallback.
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  build:
    name: Build every workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.HOLOCRON_TURBO_TOKEN || secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.HOLOCRON_TURBO_TEAM || vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository
        with:
          # --affected needs the base commit, which a depth-1 checkout does not have.
          fetch-depth: ${{ inputs.affected && '0' || '1' }}

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - uses: theholocron/.github/.github/actions/holocron@main
        name: Build
        with:
          task: build
          affected: ${{ inputs.affected }}
