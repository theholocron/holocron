# HAND-MAINTAINED — edit directly.
# Source:  theholocron/holocron · .github/workflows/knowledge.specsOnPullRequest.yml
# Tool:    n/a — not generated by `holocron repo setup` or `holocron sync github`
# Changes: edit this file and open a PR.
#
# Makes the forum post for a spec or ADR while its pull request is still open (#1600, spec
# `tech-specs-discussion-threads`), instead of waiting for the file to land on `alpha`. It runs `holocron specs sync` with
# `--files` (only the spec and ADR files this pull request changes, so a stale branch cannot retag the posts of files it
# does not touch) and `--pr` (the post names this pull request). Everything the command edits stays in this checkout and
# is thrown away: the post's address reaches the file after the merge, when the `Spec discussions` workflow finds the post
# by the path it records and links it through its sync pull request.
#
# - Only for a pull request from this repository: a post carries text the author wrote, and a fork gets no secrets.
# - Only when the pull request changes a spec or an ADR; a closed pull request does nothing (a post for a pull request
#   that never merges stays, tagged with its last status).
# - It shares the `spec-discussions` concurrency group with `knowledge.specsToIdeas.yml`, so a post is never made twice
#   by two runs at once; the post is also found by its path before it is made, so a rerun is safe.
#
# It needs the org secret `HOLOCRON_DISCORD_BOT_TOKEN`; without it the job warns and does nothing.
name: Spec discussions (pull request)

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".notes/*.spec.md"
      - "docs/wiki/specifications/*.spec.md"
      - "docs/wiki/decisions/*.md"

permissions:
  contents: read

concurrency:
  group: spec-discussions
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    if: github.repository == 'theholocron/holocron' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOLOCRON_DISCORD_BOT_TOKEN: ${{ secrets.HOLOCRON_DISCORD_BOT_TOKEN }}
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Warn that there is no Discord token
        if: env.HOLOCRON_DISCORD_BOT_TOKEN == ''
        run: |
          echo "::warning::HOLOCRON_DISCORD_BOT_TOKEN is not set, so no spec discussion was made for this pull request. Add it as an Actions secret."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout the pull request
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''
        with:
          # The whole history: a spec is numbered by when its file was first committed, and the base is needed to see
          # which files this pull request changes.
          fetch-depth: 0

      - name: List the specs and ADRs this pull request changes
        id: files
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != ''
        run: |
          # Added or modified, not deleted: a file that is gone has nothing to post.
          files=$(git diff --name-only --diff-filter=AM "$BASE_REF"...HEAD -- '.notes/*.spec.md' 'docs/wiki/specifications/*.spec.md' 'docs/wiki/decisions/*.md' | tr '\n' ' ')
          echo "list=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then echo "No spec or ADR is added or changed here."; fi

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != '' && steps.files.outputs.list != ''

      - name: Build the CLI
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != '' && steps.files.outputs.list != ''
        run: pnpm turbo run delivery.build --filter=@theholocron/cli...

      - name: Sync the discussions for these files
        if: env.HOLOCRON_DISCORD_BOT_TOKEN != '' && steps.files.outputs.list != ''
        env:
          FILES: ${{ steps.files.outputs.list }}
        run: |
          # The list is file names from this repository's own pull request; word splitting is what turns it into arguments.
          # shellcheck disable=SC2086
          node cli/cli/dist/cli.mjs specs sync --pr "$PR_NUMBER" --files $FILES
