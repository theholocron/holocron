title = "gitleaks config"

[extend]
useDefault = true

[[allowlists]]
# Matched against the detected "Secret" value via substring search, not the
# full line -- gitleaks' own generic-api-key rule truncates its capture to a
# DIFFERENT length each time it fires on the bundled/minified copy of this
# token in dist/cli.mjs (holocron#1067: 41 chars; later observed: 36 chars),
# so pinning to one exact length is not stable. The 36-char prefix below is
# the shortest truncation actually observed; the optional trailing group
# covers every longer truncation up through the full 48-char token (holocron
# #1090). Anchored with ^...$ so the match must consume the ENTIRE detected
# secret, not just appear as a substring of it -- unanchored, this prefix
# appearing inside some unrelated, longer credential would silently
# allowlist that different credential too (holocron#1067 review). A real
# secret elsewhere (including anywhere else in dist/) is unaffected -- this
# only ever matches this one specific, deliberately-public, client-side
# analytics key.
description = "PostHog public project token — client-side analytics key, not a secret"
regexes = ['''^phc_AC4vFCvYzwnzmG7Vg5nEc3PZKZztoPyf([A-Za-z0-9]{0,12})?$''']

[[allowlists]]
description = "Sentry build plugin env file — gitignored, not committed"
paths = ['''.env.sentry-build-plugin''']
