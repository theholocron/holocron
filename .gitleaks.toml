title = "gitleaks config"

[extend]
useDefault = true

[[allowlists]]
# Matched against the detected "Secret" value via substring search, not the
# full line -- gitleaks' own generic-api-key rule truncates its capture to
# 42 chars (no trailing "9BbXcLK"), so a regex requiring the complete
# 49-char token can never match what's actually being allowlisted (holocron
# CI, security.secretDetection, observed on dist/cli.mjs). Anchored with
# ^...$ so the match must consume the ENTIRE detected secret, not just
# appear as a substring of it -- unanchored, this exact 42-char sequence
# appearing inside some unrelated, longer credential would silently
# allowlist that different credential too (holocron#1067 review). The
# trailing group is optional so this still matches the full 49-char token
# too, if gitleaks (or a future rule version) ever captures it whole.
description = "PostHog public project token — client-side analytics key, not a secret"
regexes = ['''^phc_AC4vFCvYzwnzmG7Vg5nEc3PZKZztoPyfKp4Lb(9BbXcLK)?$''']

[[allowlists]]
description = "Sentry build plugin env file — gitignored, not committed"
paths = ['''.env.sentry-build-plugin''']
