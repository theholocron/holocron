name: sync-secrets

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      environment:
        description: 1Password Environment (name or id) to sync from.
        required: false
        default: Sentinel
        type: string

permissions:
  contents: read

jobs:
  sync-secrets:
    name: sync-secrets
    uses: theholocron/.github/.github/workflows/sync-secrets.yml@main
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
