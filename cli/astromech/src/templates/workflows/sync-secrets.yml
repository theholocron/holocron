name: sync-secrets

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      environment:
        description: The layer (local, dev, ci or prod) or the name of the 1Password Environment to sync from.
        required: false
        default: prod
        type: string

permissions:
  contents: read

jobs:
  sync-secrets:
    name: sync-secrets
    uses: theholocron/.github/.github/workflows/sync-secrets.yml@main
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
