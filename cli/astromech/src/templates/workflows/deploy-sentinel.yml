name: deploy-sentinel

run-name: "${{ github.event_name == 'push' && format('Deploy Sentinel: {0}', github.event.head_commit.message) || 'Deploy Sentinel (manual)' }}"

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "apps/sentinel/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-sentinel:
    name: deploy-sentinel
    uses: theholocron/.github/.github/workflows/deploy-sentinel.yml@main
    secrets: inherit
