name: lint:editorconfig

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, alpha]
  pull_request:

concurrency:
  group: lint-editorconfig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  lint-editorconfig:
    name: lint:editorconfig
    uses: theholocron/.github/.github/workflows/lint-editorconfig.yml@main
    secrets: inherit
