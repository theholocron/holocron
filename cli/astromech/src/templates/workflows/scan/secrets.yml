name: scan:secrets

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, alpha]
  pull_request:

concurrency:
  group: security-secret-detection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-secrets:
    name: scan:secrets
    uses: theholocron/.github/.github/workflows/scan-secrets.yml@main
    secrets: inherit
