name: preview-specs

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".notes/*.spec.md"
      - "docs/wiki/specifications/*.spec.md"
      - "docs/wiki/decisions/*.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  preview-specs:
    name: preview-specs
    uses: theholocron/.github/.github/workflows/preview-specs.yml@main
    secrets: inherit
