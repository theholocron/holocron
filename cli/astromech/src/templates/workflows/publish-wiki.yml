name: publish-wiki

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-preview-{0}', github.event.pull_request.number) || 'wiki' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  publish-wiki:
    name: publish-wiki
    if: ${{ github.event_name != 'pull_request' }}
    uses: theholocron/.github/.github/workflows/publish-wiki.yml@main
    secrets: inherit

  publish-wiki-preview:
    name: publish-wiki
    if: ${{ github.event_name == 'pull_request' }}
    uses: theholocron/.github/.github/workflows/publish-wiki.yml@main
    with:
      preview: true
      preview-id: pr-${{ github.event.pull_request.number }}
    secrets: inherit
