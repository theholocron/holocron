# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: holocron.docs.buildwithfern.com/holocron
    custom-domain: wiki.theholocron.dev/holocron
    multi-source: true
    edit-this-page:
      github:
        owner: theholocron
        repo: holocron
        branch: main

title: Holocron Engineering

layout:
  page-width: full
  tabs-placement: header
  searchbar-placement: header

tabs:
  decisions:
    display-name: Decisions
    icon: fa-duotone fa-scale-balanced
  standards:
    display-name: Standards
    icon: fa-duotone fa-book
  specifications:
    display-name: Specifications
    icon: fa-duotone fa-file-lines

navigation:
  - tab: decisions
    layout:
      - section: Architecture Decision Records
        contents:
          - page: Index
            path: ../docs/wiki/decisions/README.md
          - page: ADR-0001 — Vault provider
            path: ../docs/wiki/decisions/0001-vault-provider-doppler-and-infisical.md
          - page: ADR-0002 — Interactive menu spawn
            path: ../docs/wiki/decisions/0002-interactive-menu-spawn-over-reparse.md
          - page: ADR-0003 — Auth bootstrap keyring
            path: ../docs/wiki/decisions/0003-auth-bootstrap-keyring-token-precedence.md
          - page: ADR-0004 — ADR home in repo
            path: ../docs/wiki/decisions/0004-adr-home-repo-over-wiki.md
          - page: ADR-0005 — npm publishing strategy
            path: ../docs/wiki/decisions/0005-npm-publishing-strategy-oidc-over-staged.md
          - page: ADR-0006 — wiki navbar auto-broadcast
            path: ../docs/wiki/decisions/0006-wiki-navbar-auto-broadcast.md
          - page: ADR-0007 — structured logging Pino + Axiom
            path: ../docs/wiki/decisions/0007-structured-logging-pino-axiom.md

  - tab: standards
    layout:
      - section: Standards
        contents:
          - page: Overview
            path: ../docs/wiki/standards/README.md
          - section: Capabilities
            contents:
              - page: Self-contained capabilities
                path: ../docs/wiki/standards/self-contained-capabilities.md
          - section: Workflows
            contents:
              - page: Stale
                path: ../docs/wiki/standards/stale-workflow.md

  - tab: specifications
    layout:
      - section: Specifications
        contents:
          - page: Overview
            path: ../docs/wiki/specifications/README.md
          - page: Holocron v2 architecture
            path: ../docs/wiki/specifications/tech-architecture.spec.md
          - page: holocron sync command
            path: ../docs/wiki/specifications/tech-sync-command.spec.md
          - page: Extend holocron setup — repo policy + branch protection
            path: ../docs/wiki/specifications/tech-setup-and-config.spec.md
          - page: Unified repo metadata config
            path: ../docs/wiki/specifications/tech-repo-metadata.spec.md
          - page: Unified org-wide label management
            path: ../docs/wiki/specifications/ci-label-unification.spec.md
          - page: Smoke-test synced actions in sync-github
            path: ../docs/wiki/specifications/ci-sync-github-smoke-test.spec.md
          - page: Bootstrap credentials — keyring-backed token store
            path: ../docs/wiki/specifications/tech-auth-bootstrap.spec.md
          - page: Vault provider — Doppler + Infisical
            path: ../docs/wiki/specifications/tech-vault-choice.spec.md
          - page: holocron plugin create
            path: ../docs/wiki/specifications/tool-plugin-create.spec.md
          - page: "@theholocron/logger — structured logging package"
            path: ../docs/wiki/specifications/logger.spec.md
          - page: New plugins — observability, notifications, dns, analytics
            path: ../docs/wiki/specifications/plugin-observability-notifications-dns-analytics.spec.md

