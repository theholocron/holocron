# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: holocron.docs.buildwithfern.com/holocron
    custom-domain: wiki.theholocron.dev/holocron
    multi-source: true
    edit-this-page:
      github:
        owner: theholocron
        repo: holocron
        branch: main

title: Holocron Engineering

layout:
  page-width: full
  tabs-placement: header
  searchbar-placement: header

tabs:
  decisions:
    display-name: Decisions
    icon: fa-duotone fa-scale-balanced
  standards:
    display-name: Standards
    icon: fa-duotone fa-book
  specifications:
    display-name: Specifications
    icon: fa-duotone fa-file-lines

navigation:
  - tab: decisions
    layout:
      - section: Architecture Decision Records
        contents:
          - page: Index
            path: ../docs/wiki/decisions/README.md
          - page: ADR-0001 — Vault provider
            path: ../docs/wiki/decisions/0001-vault-provider-doppler-and-infisical.md
          - page: ADR-0002 — Interactive menu spawn
            path: ../docs/wiki/decisions/0002-interactive-menu-spawn-over-reparse.md
          - page: ADR-0003 — Auth bootstrap keyring
            path: ../docs/wiki/decisions/0003-auth-bootstrap-keyring-token-precedence.md
          - page: ADR-0004 — ADR home in repo
            path: ../docs/wiki/decisions/0004-adr-home-repo-over-wiki.md

  - tab: standards
    layout:
      - section: Standards
        contents:
          - page: Overview
            path: ../docs/wiki/standards/README.md

  - tab: specifications
    layout:
      - section: Specifications
        contents:
          - page: Overview
            path: ../docs/wiki/specifications/README.md

navbar-links:
  - type: github
    value: https://github.com/theholocron/holocron

colors:
  accent-primary:
    dark: "#70E155"
    light: "#008700"

logo:
  height: 20

metadata:
  og:dynamic: true
