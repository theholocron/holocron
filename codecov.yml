codecov:
  require_ci_to_pass: true

ignore:
  - "**/*.mdx"

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        flags:
          - cli
          - observability
          - skills
          - comlink
          - sentinel
          - astromech
          - datapad
          - axiom-client
          - checkly-client
          - clerk-client
          - cloudflare-client
          - confluence-client
          - discord-client
          - doppler-client
          - github-client
          - google-client
          - http-client
          - infisical-client
          - jira-client
          - neon-client
          - netlify-client
          - posthog-client
          - postman-client
          - sentry-client
          - slack-client
          - vercel-client
          - zendesk-client
          - astro-config
          - browserslist-config
          - commitlint-config
          - devmoji-config
          - eslint-config
          - lighthouse-config
          - lint-staged-config
          - markdownlint-config
          - prettier-config
          - rollup-plugin-transform-template
          - semantic-release-config
          - storybook-config
          - stylelint-config
          - tsconfig
          - tsdown-config
          - vite-config
          - vitest-config
          - holocron-plugin-1password
          - holocron-plugin-axiom
          - holocron-plugin-checkly
          - holocron-plugin-clerk
          - holocron-plugin-cloudflare
          - holocron-plugin-discord
          - holocron-plugin-doppler
          - holocron-plugin-fern
          - holocron-plugin-github
          - holocron-plugin-infisical
          - holocron-plugin-neon
          - holocron-plugin-netlify
          - holocron-plugin-posthog
          - holocron-plugin-postman
          - holocron-plugin-sentry
          - holocron-plugin-slack
          - holocron-plugin-vercel
          - docs-theme
          - array-utils
          - date-time-utils
          - env-utils
          - fs-utils
          - git-utils
          - json-utils
          - location-utils
          - misc-utils
          - object-utils
          - pkg-utils
          - storage-utils
          - string-utils
          - uri-utils
          - ci
        target: auto
        if_not_found: success
        threshold: 2%
      # Doc-comment coverage of the public API (#1368), uploaded as its own flag by the Docs coverage
      # workflow. Its own named status, so the required codecov/project above keeps counting only the tests.
      documentation:
        flags:
          - documentation
        target: auto
        if_not_found: success
    patch:
      default:
        flags:
          - cli
          - observability
          - skills
          - comlink
          - sentinel
          - astromech
          - datapad
          - axiom-client
          - checkly-client
          - clerk-client
          - cloudflare-client
          - confluence-client
          - discord-client
          - doppler-client
          - github-client
          - google-client
          - http-client
          - infisical-client
          - jira-client
          - neon-client
          - netlify-client
          - posthog-client
          - postman-client
          - sentry-client
          - slack-client
          - vercel-client
          - zendesk-client
          - astro-config
          - browserslist-config
          - commitlint-config
          - devmoji-config
          - eslint-config
          - lighthouse-config
          - lint-staged-config
          - markdownlint-config
          - prettier-config
          - rollup-plugin-transform-template
          - semantic-release-config
          - storybook-config
          - stylelint-config
          - tsconfig
          - tsdown-config
          - vite-config
          - vitest-config
          - holocron-plugin-1password
          - holocron-plugin-axiom
          - holocron-plugin-checkly
          - holocron-plugin-clerk
          - holocron-plugin-cloudflare
          - holocron-plugin-discord
          - holocron-plugin-doppler
          - holocron-plugin-fern
          - holocron-plugin-github
          - holocron-plugin-infisical
          - holocron-plugin-neon
          - holocron-plugin-netlify
          - holocron-plugin-posthog
          - holocron-plugin-postman
          - holocron-plugin-sentry
          - holocron-plugin-slack
          - holocron-plugin-vercel
          - docs-theme
          - array-utils
          - date-time-utils
          - env-utils
          - fs-utils
          - git-utils
          - json-utils
          - location-utils
          - misc-utils
          - object-utils
          - pkg-utils
          - storage-utils
          - string-utils
          - uri-utils
          - ci
        target: 80%
        if_not_found: success
        threshold: 2%
      documentation:
        flags:
          - documentation
        target: 100%
        if_not_found: success

