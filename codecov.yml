codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        if_not_found: success
        threshold: 2%
    patch:
      default:
        target: 80%
        if_not_found: success
        threshold: 2%

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true

component_management:
  default_rules:
    statuses:
      - type: patch
        target: 80%
        if_not_found: success
  individual_components:
    # apps
    - component_id: comlink
      name: "comlink"
      paths:
        - apps/comlink/**

    - component_id: sentinel
      name: "sentinel"
      paths:
        - apps/sentinel/**

    # cli
    - component_id: astromech
      name: "astromech"
      paths:
